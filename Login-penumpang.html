<html lang="id">
<head>

    name="viewport"

  <link
    rel="stylesheet"

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        sans-serif;

      color: #241345;

      background:
        linear-gradient(
          145deg,
          #f7f3ff,
          #eee7ff
        );
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      padding: 20px 18px;

      color: white;

      background:
        radial-gradient(
          circle at 90% 20%,
          rgba(255,138,0,.65),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #351078,
          #7028f5,
          #4b16bb
        );

      box-shadow:
        0 8px 25px
        rgba(80,30,170,.18);
    }

    .brand {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .brand span {
      color: #ff9a00;
    }

    .subtitle {
      margin-top: 5px;

      font-size: 13px;
      opacity: .9;
    }

    /* =========================
       CONTAINER
    ========================= */

    .container {
      width: 100%;
      max-width: 650px;

      margin: 0 auto;

      padding: 18px;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      display: none;

      margin-bottom: 15px;
      padding: 13px 15px;

      border-radius: 14px;

      background: #ffffff;

      box-shadow:
        0 6px 20px
        rgba(50,20,100,.08);

      font-size: 13px;
      line-height: 1.5;
    }

    /* =========================
       CARD
    ========================= */

    .card {
      margin-bottom: 16px;

      padding: 18px;

      background: white;

      border-radius: 20px;

      box-shadow:
        0 8px 25px
        rgba(50,20,100,.08);
    }

    .card-title {
      margin: 0 0 15px;

      font-size: 18px;
      font-weight: 900;
    }

    /* =========================
       INPUT
    ========================= */

    label {
      display: block;

      margin:
        14px 0 7px;

      font-size: 12px;
      font-weight: 800;
    }

    input {
      width: 100%;

      padding: 13px 14px;

      border:
        1px solid #ded5f0;

      border-radius: 12px;

      background: #faf9ff;

      color: #241345;

      font-size: 14px;

      outline: none;
    }

    input:focus {
      border-color: #7028f5;

      box-shadow:
        0 0 0 3px
        rgba(112,40,245,.09);
    }

    /* =========================
       LOCATION BUTTON
    ========================= */

    .location-button {
      width: 100%;

      margin-top: 10px;

      padding: 12px;

      border: none;

      border-radius: 11px;

      background: #f1ebff;

      color: #6420d8;

      font-size: 13px;
      font-weight: 800;
    }

    /* =========================
       COORDINATE BOX
    ========================= */

    .coordinate-box {
      margin-top: 10px;

      padding: 11px;

      border-radius: 11px;

      background: #f8f6ff;

      color: #665d78;

      font-size: 11px;

      line-height: 1.7;

      overflow-wrap: anywhere;
    }

    /* =========================
       VEHICLE
    ========================= */

    .vehicle-grid {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;
    }

    .vehicle-button {
      padding: 16px 10px;

      border:
        2px solid #e2d9f4;

      border-radius: 15px;

      background: white;

      color: #3d3155;

      font-size: 14px;
      font-weight: 900;
    }

    .vehicle-button.active {
      border-color: #7028f5;

      background:
        linear-gradient(
          135deg,
          #f0e7ff,
          #ffffff
        );

      color: #7028f5;

      box-shadow:
        0 5px 16px
        rgba(112,40,245,.13);
    }

    .vehicle-icon {
      display: block;

      margin-bottom: 6px;

      font-size: 28px;
    }

    /* =========================
       MAP
    ========================= */

    #map {
      width: 100%;

      height: 340px;

      border-radius: 18px;

      overflow: hidden;

      box-shadow:
        0 6px 18px
        rgba(40,20,80,.12);
    }

    /* =========================
       ORDER BUTTON
    ========================= */

    .order-button {
      width: 100%;

      margin-top: 16px;

      padding: 16px;

      border: none;

      border-radius: 14px;

      background:
        linear-gradient(
          110deg,
          #ffad18,
          #ff8a00,
          #ff6500
        );

      color: white;

      font-size: 16px;
      font-weight: 900;

      box-shadow:
        0 7px 18px
        rgba(255,115,0,.23);
    }

    .order-button:disabled {
      opacity: .55;
    }

    /* =========================
       INFO
    ========================= */

    .info-grid {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;
    }

    .info-item {
      padding: 12px;

      border-radius: 12px;

      background: #f8f6ff;
    }

    .info-label {
      font-size: 10px;

      color: #8b829c;

      font-weight: 800;
    }

    .info-value {
      margin-top: 4px;

      font-size: 12px;

      font-weight: 800;

      overflow-wrap: anywhere;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      padding: 10px 0 25px;

      text-align: center;

      color: #91899f;

      font-size: 11px;
    }

  </style>
</head>

    const motorButton =

    /* =====================================================
       GPS
    ===================================================== */

    function ambilLokasi() {

      if (
        !navigator.geolocation
      ) {

        tampilkanStatus(
          "GPS tidak tersedia pada perangkat ini."
        );

        return;

      }


      tampilkanStatus(
        "Sedang mengambil posisi GPS..."
      );


      navigator.geolocation.getCurrentPosition(

        function(position) {

          posisiSayaLat =
            position.coords.latitude;

          posisiSayaLng =
            position.coords.longitude;


          perbaruiPosisiSaya();

          mulaiPantauGPS();

          reverseGeocode(
            posisiSayaLat,
            posisiSayaLng
          );


          tampilkanStatus(
            "Lokasi GPS berhasil ditemukan."
          );

        },

        function(error) {

          console.error(
            "GPS error:",
            error
          );

          tampilkanStatus(
            "Lokasi GPS tidak berhasil diambil. Pastikan izin lokasi diberikan."
          );

        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 5000
        }

      );

    }


    gpsButton.addEventListener(
      "click",
      ambilLokasi
    );


    function mulaiPantauGPS() {

      if (gpsWatcher !== null) {

        return;

      }


      gpsWatcher =
        navigator.geolocation.watchPosition(

          function(position) {

            posisiSayaLat =
              position.coords.latitude;

            posisiSayaLng =
              position.coords.longitude;

            perbaruiPosisiSaya();

          },

          function(error) {

            console.error(
              "GPS watch error:",
              error
            );

          },

          {
            enableHighAccuracy: true,
            maximumAge: 3000,
            timeout: 15000
          }

        );

    }


    function perbaruiPosisiSaya() {

      if (
        posisiSayaLat === null ||
        posisiSayaLng === null
      ) {

        return;

      }


      koordinatSaya.innerHTML =
        "Latitude: " +
        posisiSayaLat.toFixed(6) +
        "<br>" +
        "Longitude: " +
        posisiSayaLng.toFixed(6);


      infoSaya.textContent =
        posisiSayaLat.toFixed(5) +
        ", " +
        posisiSayaLng.toFixed(5);


      if (
        sayaMarker === null
      ) {

        sayaMarker =
          L.marker(
            [
              posisiSayaLat,
              posisiSayaLng
            ],
            {
              icon: iconSaya
            }
          ).addTo(map);

        sayaMarker.bindPopup(
          "Posisi Saya"
        );

        map.setView(
          [
            posisiSayaLat,
            posisiSayaLng
          ],
          16
        );

      } else {

        sayaMarker.setLatLng(
          [
            posisiSayaLat,
            posisiSayaLng
          ]
        );

      }

    }


    /* =====================================================
       REVERSE GEOCODING
    ===================================================== */

    async function reverseGeocode(
      lat,
      lng
    ) {

      try {

        const url =
          "https://nominatim.openstreetmap.org/reverse" +
          "?format=json" +
          "&lat=" +
          encodeURIComponent(lat) +
          "&lon=" +
          encodeURIComponent(lng) +
          "&zoom=18" +
          "&addressdetails=1";


        const response =
          await fetch(url, {
            headers: {
              "Accept":
                "application/json"
            }
          });


        if (
          !response.ok
        ) {

          throw new Error(
            "Reverse geocoding gagal."
          );

        }


        const data =
          await response.json();


        if (
          data.display_name
        ) {

          posisiSaya.value =
            data.display_name;

          pickupInput.value =
            data.display_name;

          pickupLat =
            lat;

          pickupLng =
            lng;

          perbaruiPickup();

        }

      } catch (error) {

        console.error(
          "Reverse geocode:",
          error
        );

      }

    }


    /* =====================================================
       CARI KOORDINAT ALAMAT
    ===================================================== */

    async function cariKoordinat(
      alamat
    ) {

      const query =
        alamat.trim() +
        ", Indonesia";


      const url =
        "https://nominatim.openstreetmap.org/search" +
        "?format=json" +
        "&limit=1" +
        "&countrycodes=id" +
        "&q=" +
        encodeURIComponent(query);


      const response =
        await fetch(url, {
          headers: {
            "Accept":
              "application/json"
          }
        });


      if (
        !response.ok
      ) {

        throw new Error(
          "Tidak dapat menghubungi layanan pencarian lokasi."
        );

      }


      const data =
        await response.json();


      if (
        !data ||
        data.length === 0
      ) {

        throw new Error(
          "Lokasi tidak ditemukan: " +
          alamat
        );

      }


      return {

        lat:
          Number(data[0].lat),

        lng:
          Number(data[0].lon),

        displayName:
          data[0].display_name

      };

    }


    /* =====================================================
       PICKUP
    ===================================================== */

    function perbaruiPickup() {

      if (
        pickupLat === null ||
        pickupLng === null
      ) {

        return;

      }


      koordinatPickup.innerHTML =
        "Latitude: " +
        pickupLat.toFixed(6) +
        "<br>" +
        "Longitude: " +
        pickupLng.toFixed(6);


      if (
        pickupMarker === null
      ) {

        pickupMarker =
          L.marker(
            [
              pickupLat,
              pickupLng
            ],
            {
              icon: iconPickup
            }
          ).addTo(map);

        pickupMarker.bindPopup(
          "Titik Jemput"
        );

      } else {

        pickupMarker.setLatLng(
          [
            pickupLat,
            pickupLng
          ]
        );

      }

    }


    /* =====================================================
       TUJUAN
    ===================================================== */

    async function prosesTujuan() {

      const alamat =
        destinationInput.value.trim();


      if (
        alamat === ""
      ) {

        throw new Error(
          "Tujuan belum diisi."
        );

      }


      tampilkanStatus(
        "Mencari koordinat tujuan..."
      );


      const hasil =
        await cariKoordinat(
          alamat
        );


      tujuanLat =
        hasil.lat;

      tujuanLng =
        hasil.lng;


      koordinatTujuan.innerHTML =
        "Latitude: " +
        tujuanLat.toFixed(6) +
        "<br>" +
        "Longitude: " +
        tujuanLng.toFixed(6);


      if (
        tujuanMarker === null
      ) {

        tujuanMarker =
          L.marker(
            [
              tujuanLat,
              tujuanLng
            ],
            {
              icon: iconTujuan
            }
          ).addTo(map);

        tujuanMarker.bindPopup(
          "Tujuan"
        );

      } else {

        tujuanMarker.setLatLng(
          [
            tujuanLat,
            tujuanLng
          ]
        );

      }


      tampilkanRutePickupTujuan();

    }


    /* =====================================================
       DRIVER LOCATION
    ===================================================== */

    function pantauDriver() {

      const driverRef =
        ref(
          db,
          "driverLocations/" +
          UID_PENGEMUDI
        );


      onValue(
        driverRef,
        function(snapshot) {

          if (
            !snapshot.exists()
          ) {

            infoDriver.textContent =
              "Driver belum mengirim lokasi.";

            return;

          }


          const data =
            snapshot.val();


          if (
            typeof data.lat !==
              "number" ||
            typeof data.lng !==
              "number"
          ) {

            infoDriver.textContent =
              "Lokasi driver belum valid.";

            return;

          }


          driverLat =
            data.lat;

          driverLng =
            data.lng;


          infoDriver.textContent =
            driverLat.toFixed(5) +
            ", " +
            driverLng.toFixed(5);


          if (
            driverMarker === null
          ) {

            driverMarker =
              L.marker(
                [
                  driverLat,
                  driverLng
                ],
                {
                  icon: iconDriver
                }
              ).addTo(map);

            driverMarker.bindPopup(
              "Driver NEXX"
            );

          } else {

            driverMarker.setLatLng(
              [
                driverLat,
                driverLng
              ]
            );

          }


          hitungJarakDriver();


          if (
            pickupLat !== null &&
            pickupLng !== null
          ) {

            const jarak =
              hitungJarakMeter(
                driverLat,
                driverLng,
                pickupLat,
                pickupLng
              );


            if (
              lastRouteDriverLat === null ||
              lastRouteDriverLng === null ||
              jarakPerubahanDriver()
            ) {

              buatRuteDriverPickup();

            }

          }

        }
      );

    }


    function jarakPerubahanDriver() {

      if (
        lastRouteDriverLat === null ||
        lastRouteDriverLng === null
      ) {

        return true;

      }


      const perubahan =
        hitungJarakMeter(
          driverLat,
          driverLng,
          lastRouteDriverLat,
          lastRouteDriverLng
        );


      return perubahan >= 50;

    }


    /* =====================================================
       JARAK
    ===================================================== */

    function hitungJarakMeter(
      lat1,
      lon1,
      lat2,
      lon2
    ) {

      const R =
        6371000;


      const dLat =
        (lat2 - lat1) *
        Math.PI /
        180;


      const dLon =
        (lon2 - lon1) *
        Math.PI /
        180;


      const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(
          lat1 * Math.PI / 180
        ) *

        Math.cos(
          lat2 * Math.PI / 180
        ) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);


      const c =
        2 *
        Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        );


      return R * c;

    }


    function formatJarak(
      meter
    ) {

      if (
        meter < 1000
      ) {

        return (
          Math.round(meter) +
          " m"
        );

      }


      return (
        (meter / 1000)
          .toFixed(2) +
        " km"
      );

    }


    function hitungJarakDriver() {

      if (
        driverLat === null ||
        driverLng === null ||
        pickupLat === null ||
        pickupLng === null
      ) {

        infoJarakDriver.textContent =
          "-";

        return;

      }


      const jarak =
        hitungJarakMeter(
          driverLat,
          driverLng,
          pickupLat,
          pickupLng
        );


      infoJarakDriver.textContent =
        formatJarak(jarak);

    }


    /* =====================================================
       OSRM DRIVER → PICKUP
    ===================================================== */

    async function buatRuteDriverPickup() {

      if (
        driverLat === null ||
        driverLng === null ||
        pickupLat === null ||
        pickupLng === null
      ) {

        return;

      }


      try {

        const url =
          "https://router.project-osrm.org/route/v1/driving/" +
          driverLng +
          "," +
          driverLat +
          ";" +
          pickupLng +
          "," +
          pickupLat +
          "?overview=full&geometries=geojson";


        const response =
          await fetch(url);


        if (
          !response.ok
        ) {

          throw new Error(
            "OSRM gagal."
          );

        }


        const data =
          await response.json();


        if (
          !data.routes ||
          data.routes.length === 0
        ) {

          return;

        }


        const coordinates =
          data.routes[0]
            .geometry
            .coordinates
            .map(
              function(item) {

                return [
                  item[1],
                  item[0]
                ];

              }
            );


        if (
          routeDriverPickup !== null
        ) {

          map.removeLayer(
            routeDriverPickup
          );

        }


        routeDriverPickup =
          L.polyline(
            coordinates,
            {
              color:
                "#FF8A00",

              weight: 5,

              opacity: .85
            }
          ).addTo(map);


        lastRouteDriverLat =
          driverLat;

        lastRouteDriverLng =
          driverLng;

      } catch (error) {

        console.error(
          "Rute driver:",
          error
        );

      }

    }


    /* =====================================================
       OSRM PICKUP → TUJUAN
    ===================================================== */

    async function tampilkanRutePickupTujuan() {

      if (
        pickupLat === null ||
        pickupLng === null ||
        tujuanLat === null ||
        tujuanLng === null
      ) {

        return;

      }


      try {

        const url =
          "https://router.project-osrm.org/route/v1/driving/" +
          pickupLng +
          "," +
          pickupLat +
          ";" +
          tujuanLng +
          "," +
          tujuanLat +
          "?overview=full&geometries=geojson";


        const response =
          await fetch(url);


        if (
          !response.ok
        ) {

          throw new Error(
            "OSRM gagal."
          );

        }


        const data =
          await response.json();


        if (
          !data.routes ||
          data.routes.length === 0
        ) {

          return;

        }


        const coordinates =
          data.routes[0]
            .geometry
            .coordinates
            .map(
              function(item) {

                return [
                  item[1],
                  item[0]
                ];

              }
            );


        if (
          routePickupTujuan !== null
        ) {

          map.removeLayer(
            routePickupTujuan
          );

        }


        routePickupTujuan =
          L.polyline(
            coordinates,
            {
              color:
                "#7028F5",

              weight: 6,

              opacity: .9
            }
          ).addTo(map);


      } catch (error) {

        console.error(
          "Rute pickup tujuan:",
          error
        );

      }

    }


    /* =====================================================
       ORDER
    ===================================================== */

    async function kirimPesanan() {

      if (
        !authSudahSiap ||
        !penggunaAktif
      ) {

        tampilkanStatus(
          "Akun belum siap. Tunggu sebentar lalu coba lagi."
        );

        return;

      }


      if (
        penggunaAktif.uid !==
        UID_PENUMPANG
      ) {

        tampilkanStatus(
          "Akun ini bukan akun penumpang simulasi NEXX."
        );

        return;

      }


      const pickup =
        pickupInput.value.trim();


      const destination =
        destinationInput.value.trim();


      if (
        pickup === ""
      ) {

        tampilkanStatus(
          "Titik jemput belum diisi."
        );

        return;

      }


      if (
        destination === ""
      ) {

        tampilkanStatus(
          "Tujuan belum diisi."
        );

        return;

      }


      if (
        kendaraanDipilih === ""
      ) {

        tampilkanStatus(
          "Silakan pilih kendaraan terlebih dahulu."
        );

        return;

      }


      orderButton.disabled =
        true;


      try {

        tampilkanStatus(
          "Menyiapkan lokasi perjalanan..."
        );


        /* =========================================
           PICKUP
        ========================================= */

        if (
          pickupLat === null ||
          pickupLng === null
        ) {

          const hasilPickup =
            await cariKoordinat(
              pickup
            );


          pickupLat =
            hasilPickup.lat;

          pickupLng =
            hasilPickup.lng;


          perbaruiPickup();

        }


        /* =========================================
           TUJUAN
        ========================================= */

        if (
          tujuanLat === null ||
          tujuanLng === null
        ) {

          await prosesTujuan();

        }


        /* =========================================
           BUAT ORDER
        ========================================= */

        tampilkanStatus(
          "Mengirim pesanan ke sistem NEXX..."
        );


        const pesananRef =
          push(
            ref(
              db,
              "orders"
            )
          );


        const dataPesanan = {

          passengerUid:
            penggunaAktif.uid,

          driverUid:
            "",

          pickup:
            pickup,

          pickupLat:
            pickupLat,

          pickupLng:
            pickupLng,

          destination:
            destination,

          tujuanLat:
            tujuanLat,

          tujuanLng:
            tujuanLng,

          vehicle:
            kendaraanDipilih,

          status:
            "SEARCHING",

          createdAt:
            serverTimestamp()

        };


        await set(
          pesananRef,
          dataPesanan
        );


        /* =========================================
           SIMPAN ORDER ID
        ========================================= */

        localStorage.setItem(
          "nexxActiveOrderId",
          pesananRef.key
        );


        tampilkanStatus(
          "Pesanan berhasil dibuat. Mencari driver..."
        );


        /* =========================================
           PINDAH KE HALAMAN CARI DRIVER
        ========================================= */

        setTimeout(
          function() {

            window.location.href =
              "NEXX-CARI-DRIVER.html";

          },
          500
        );


      } catch (error) {

        console.error(
          "ORDER ERROR:",
          error
        );


        tampilkanStatus(
          error.message ||
          "Pesanan gagal dibuat."
        );


        orderButton.disabled =
          false;

      }

    }


    orderButton.addEventListener(
      "click",
      kirimPesanan
    );


    /* =====================================================
       AUTH
       ===================================================== */

    onAuthStateChanged(
      auth,
      function(user) {

        if (
          user
        ) {

          penggunaAktif =
            user;

          authSudahSiap =
            true;


          if (user.uid === UID_PENUMPANG) {
    penggunaAktif = user;
    authSudahSiap = true;

    orderButton.disabled = false;

    tampilkanStatus("Akun penumpang aktif. Silakan tentukan perjalanan.");

    pantauDriver();
}

          } else {

            tampilkanStatus(
              "Akun berhasil terdeteksi, tetapi bukan akun penumpang simulasi."
            );

            orderButton.disabled =
              true;

          }


        } else {

          /*
           * PENTING:
           * TIDAK ADA REDIRECT KE LOGIN.
           *
           * Kita biarkan halaman tetap terbuka
           * supaya status Auth tidak menyebabkan
           * halaman memantul kembali ke login.
           */

          penggunaAktif =
            null;

          authSudahSiap =
            false;


          tampilkanStatus(
            "Sesi akun belum tersedia. Silakan kembali ke halaman login jika diperlukan."
          );


          orderButton.disabled =
            true;

        }

      }
    );


    /* =====================================================
       START DRIVER MONITORING
    ===================================================== */

    pantauDriver();


    /* =====================================================
       START GPS
    ===================================================== */

    ambilLokasi();

  </script>
