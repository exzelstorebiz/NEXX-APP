<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7028F5">
  <title>NEXX Penumpang</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f3fa;
      color: #202033;
    }

    .header {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      padding: 30px 22px 34px;
      background:
        radial-gradient(
          circle at 90% 15%,
          rgba(255, 138, 0, .75),
          transparent 27%
        ),
        radial-gradient(
          circle at 70% 100%,
          rgba(190, 70, 255, .65),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #351078 0%,
          #7028f5 48%,
          #29065f 100%
        );
      color: #fff;
      border-radius: 0 0 30px 30px;
      box-shadow: 0 10px 28px rgba(91, 32, 190, .25);
    }

    .header::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 210px;
      height: 210px;
      right: -75px;
      top: -90px;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 50%;
      box-shadow:
        0 0 0 18px rgba(255, 255, 255, .035),
        0 0 0 38px rgba(255, 255, 255, .025);
    }

    .header::after {
      content: "✦  ◆  ·  ✦";
      position: absolute;
      right: 20px;
      bottom: 17px;
      color: #ffab37;
      font-size: 15px;
      letter-spacing: 7px;
      opacity: .9;
    }

    .brand {
      position: relative;
      font-size: 29px;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 3px 15px rgba(0, 0, 0, .18);
    }

    .brand span {
      color: #ff8a00;
      text-shadow: 0 0 18px rgba(255, 138, 0, .6);
    }

    .subtitle {
      position: relative;
      max-width: 270px;
      margin-top: 7px;
      font-size: 14px;
      line-height: 1.6;
      opacity: .9;
    }

    .container {
      padding: 20px 16px 35px;
      max-width: 560px;
      margin: auto;
    }

    .welcome {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .description {
      color: #777487;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 17px;
      box-shadow: 0 5px 20px rgba(48, 27, 90, .07);
    }

    .card-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #777487;
      margin: 14px 0 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #e2deed;
      border-radius: 12px;
      background: #faf9fd;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #7028f5;
    }

    /* NEXX LOCATION ROW */

    .location-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      padding: 8px;
      border: 1px solid #e8e0fa;
      border-radius: 18px;
      background: linear-gradient(135deg, #ffffff, #faf7ff);
      box-shadow: 0 5px 16px rgba(77, 38, 145, .07);
    }

    .location-row input {
      flex: 1;
      min-width: 0;
      padding: 12px 10px;
      border: 1px solid #e3dcf5;
      border-radius: 12px;
      background: #faf9ff;
      color: #241345;
      font-size: 14px;
      outline: none;
    }

    .location-row input:focus {
      border-color: #792cff;
      box-shadow: 0 0 0 3px rgba(121, 44, 255, .09);
    }

    /* DESTINATION */

    #destination {
      width: 100%;
      min-width: 0;
      padding: 15px;
      border: 1px solid #e3dcf5;
      border-radius: 13px;
      background: #faf9ff;
      color: #241345;
      font-size: 14px;
      box-shadow: inset 0 1px 3px rgba(60, 30, 100, .03);
    }

    #destination:focus {
      border-color: #ff8a00;
      box-shadow: 0 0 0 3px rgba(255, 138, 0, .10);
    }

    .destination-panel {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 8px;
      padding: 7px;
      border: 1px solid #e8e0fa;
      border-radius: 20px;
      background: linear-gradient(135deg, #ffffff, #faf7ff);
      box-shadow: 0 6px 18px rgba(77, 38, 145, .08);
    }

    .destination-icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #fff;
      background: linear-gradient(135deg, #ff9a00, #ff6500);
      border-radius: 14px;

      font-size: 25px;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(150, 55, 0, .2);
    }

    .destination-input {
      flex: 1;
      min-width: 0;
    }

    .destination-panel .destination-input input {
      width: 100%;
      min-width: 0;
      padding: 12px 9px;
      border: 1px solid #e3dcf5;
      border-radius: 12px;
      background: #faf9ff;
      color: #241345;
      font-size: 13px;
    }

    .destination-panel .destination-input input:focus {
      border-color: #ff8a00;
      box-shadow: 0 0 0 3px rgba(255, 138, 0, .10);
    }

    .search-destination-button {
      width: 40px;
      height: 44px;
      flex-shrink: 0;

      border: none;
      border-radius: 12px;

      background: transparent;
      color: #5420a8;

      font-size: 32px;
      font-weight: bold;

      cursor: pointer;
    }

    .search-destination-button:active {
      transform: scale(.94);
    }

    /* PICKUP */

    .pickup-panel {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px;
      border: 1px solid #e8e0fa;
      border-radius: 20px;
      background: linear-gradient(135deg, #ffffff, #faf7ff);
      box-shadow: 0 6px 18px rgba(77, 38, 145, .08);
    }

    .location-icon {
      flex-shrink: 0;
      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 15px;
      font-size: 29px;
      font-weight: 900;
    }

    .pickup-icon {
      color: #7028f5;
      background: linear-gradient(135deg, #eee4ff, #dfcaff);
      text-shadow: 0 0 12px rgba(112, 40, 245, .25);
    }

    .location-input {
      flex: 1;
      min-width: 0;
    }

    .pickup-panel .location-input input {
      width: 100%;
      min-width: 0;
      padding: 12px 10px;
      border: 1px solid #e3dcf5;
      border-radius: 12px;
      background: #faf9ff;
      font-size: 13px;
    }

    .pickup-panel .small-button {
      padding: 0 10px;
      min-height: 44px;
      white-space: nowrap;
      font-size: 12px;
    }

    .small-button {
      flex-shrink: 0;
      min-height: 48px;
      padding: 0 15px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #8d2cff, #4b0bea);
      color: #ffffff;
      font-size: 14px;
      font-weight: 900;
      box-shadow: 0 5px 12px rgba(91, 27, 220, .25);
      transition: transform .2s ease;
    }

    .small-button:active {
      transform: scale(.96);
    }

    /* ORDER BUTTON */

    .order-button {
      position: relative;
      display: block;
      width: 100%;
      min-height: 62px;
      padding: 17px 20px;
      margin-top: 24px;
      overflow: hidden;

      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: 17px;

      background:
        linear-gradient(
          110deg,
          #ffad18 0%,
          #ff8a00 45%,
          #ff6500 100%
        );

      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: .4px;

      box-shadow:
        0 8px 20px rgba(255, 115, 0, .28),
        inset 0 1px 0 rgba(255, 255, 255, .3);

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        filter .2s ease;
    }

    .order-button:active {
      transform: scale(.98);
      filter: brightness(1.05);

      box-shadow:
        0 4px 10px rgba(255, 115, 0, .22),
        inset 0 2px 5px rgba(120, 50, 0, .12);
    }

    /* VEHICLE */

    .vehicle-title {
      margin-top: 26px;
      font-size: 16px;
      font-weight: 900;
      color: #241345;
      letter-spacing: .2px;
    }

    .vehicle-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
      margin-top: 14px;
    }

    .vehicle-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 0;
      min-height: 215px;
      padding: 20px 10px;
      overflow: hidden;

      border: 1.5px solid #e2d8f8;
      border-radius: 22px;

      background:
        radial-gradient(
          circle at 50% 15%,
          rgba(112, 40, 245, .09),
          transparent 45%
        ),
        linear-gradient(145deg, #ffffff, #f8f5ff);

      color: #241345;
      font-family: Arial, sans-serif;

      box-shadow: 0 7px 18px rgba(58, 26, 108, .07);

      transition:
        background .25s ease,
        border-color .25s ease,
        box-shadow .25s ease,
        transform .2s ease;
    }

    .vehicle-card:active {
      transform: scale(.97);
    }

    .vehicle-card.selected {
      border: 2px solid #792cff;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(255, 138, 0, .19),
          transparent 43%
        ),
        linear-gradient(145deg, #f5edff, #e8d9ff);

      box-shadow:
        0 0 0 3px rgba(121, 44, 255, .08),
        0 9px 24px rgba(112, 40, 245, .19),
        inset 0 0 20px rgba(255, 255, 255, .7);
    }

    .vehicle-icon {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 82px;
      height: 72px;

      font-size: 49px;
      line-height: 1;

      filter: drop-shadow(0 5px 5px rgba(74, 32, 120, .16));

      transition: transform .25s ease;
    }

    .vehicle-card.selected .vehicle-icon {
      transform: translateY(-3px) scale(1.06);
    }

    .vehicle-name {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: .7px;
    }

    .vehicle-card.selected .vehicle-name {
      color: #6420d8;
    }

    .vehicle-desc {
      font-size: 11px;
      color: #777087;
      text-align: center;
    }

    .vehicle-check {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 27px;
      height: 27px;

      margin-top: 3px;

      border: 2px solid #d8cbed;
      border-radius: 50%;

      background: #fff;
      color: #792cff;

      font-size: 17px;
      font-weight: 900;

      box-shadow: 0 2px 7px rgba(54, 24, 96, .08);
    }

    .vehicle-card.selected .vehicle-check {
      border-color: #792cff;
      background: #792cff;
      color: #fff;

      box-shadow: 0 0 13px rgba(121, 44, 255, .35);
    }

    .status {
      padding: 13px;
      border-radius: 12px;
      background: #f0ebff;
      color: #6021d1;
      font-size: 13px;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      color: #9691a6;
      font-size: 12px;
      padding: 10px;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="brand">NEX<span>X</span></div>
    <div class="subtitle">
      Simulasi perjalanan menuju mega proyek.
    </div>
  </header>


  <main class="container">

    <div class="welcome">
      Halo, Penumpang! 👋
    </div>

    <div class="description">
      Tentukan perjalanan yang ingin kamu tuju.
    </div>


    <section class="card">

      <div class="card-title">
        📍 Rencana Perjalanan
      </div>


      <!-- ========================= -->
      <!-- PICKUP -->
      <!-- ========================= -->

      <label for="pickup">
        Lokasi penjemputan
      </label>

      <div class="pickup-panel">

        <div class="location-icon pickup-icon">
          ✥
        </div>

        <div class="location-input">

          <input
            id="pickup"
            type="text"
            placeholder="Masukkan lokasi penjemputan"
          >

        </div>

        <button
          class="small-button"
          type="button"
          onclick="ambilLokasi()"
        >
          Posisi saya
        </button>

      </div>


      <!-- ========================= -->
      <!-- DESTINATION -->
      <!-- ========================= -->

      <label for="destination">
        Tujuan perjalanan
      </label>

      <div class="destination-panel">

        <div class="location-icon destination-icon">
          📍
        </div>

        <div class="destination-input">

          <input
            id="destination"
            type="text"
            placeholder="Mau pergi ke mana?"
          >

        </div>

        <button
          class="search-destination-button"
          type="button"
          onclick="fokusTujuan()"
          aria-label="Fokus ke kolom tujuan"
        >
          ⌕
        </button>

      </div>


      <!-- ========================= -->
      <!-- VEHICLE -->
      <!-- ========================= -->

      <div class="vehicle-title">
        Pilih Kendaraan
      </div>

      <div class="vehicle-options">

        <button
          type="button"
          class="vehicle-card"
          id="bikeCard"
          onclick="pilihKendaraan('BIKE')"
        >

          <span class="vehicle-icon">
            🏍️
          </span>

          <span class="vehicle-name">
            BIKE
          </span>

          <span class="vehicle-desc">
            Sepeda motor
          </span>

          <span
            class="vehicle-check"
            id="bikeCheck"
          >
            ○
          </span>

        </button>


        <button
          type="button"
          class="vehicle-card"
          id="carCard"
          onclick="pilihKendaraan('MOBIL')"
        >

          <span class="vehicle-icon">
            🚗
          </span>

          <span class="vehicle-name">
            MOBIL
          </span>

          <span class="vehicle-desc">
            Mobil penumpang
          </span>

          <span
            class="vehicle-check"
            id="carCheck"
          >
            ○
          </span>

        </button>

      </div>


      <!-- ========================= -->
      <!-- ORDER -->
      <!-- ========================= -->

      <button
        class="order-button"
        type="button"
        onclick="periksaPesanan()"
      >
        CARI PENGEMUDI →
      </button>

    </section>


    <!-- ========================= -->
    <!-- STATUS -->
    <!-- ========================= -->

    <section class="card">

      <div class="card-title">
        🚗 Status Perjalanan
      </div>

      <div
        class="status"
        id="status"
      >
        Belum ada pesanan. Silakan masukkan lokasi
        penjemputan dan tujuan.
      </div>

    </section>


    <div class="footer">
      NEXX SIMULATION · By SUHENDRO
    </div>

  </main>


  <!-- ===================================================== -->
  <!-- JAVASCRIPT UTAMA -->
  <!-- ===================================================== -->

  <script>

    // ==========================================
    // VARIABEL KOORDINAT
    // ==========================================

    let pickupLat = null;
    let pickupLng = null;

    let tujuanLat = null;
    let tujuanLng = null;

    let pickupMenggunakanGPS = false;

    let kendaraanDipilih = "";


    // ==========================================
    // POSISI SAYA
    // ==========================================

    function ambilLokasi() {

      const status =
        document.getElementById("status");

      const pickup =
        document.getElementById("pickup");


      if (!navigator.geolocation) {

        status.textContent =
          "Browser ini tidak mendukung GPS.";

        return;
      }


      status.textContent =
        "Sedang menentukan posisi Anda...";


      navigator.geolocation.getCurrentPosition(

        function(position) {

          pickupLat =
            position.coords.latitude;

          pickupLng =
            position.coords.longitude;


          pickupMenggunakanGPS = true;


          // Yang ditampilkan ke penumpang
          // BUKAN angka koordinat.

          pickup.value =
            "Posisi saya sekarang";


          status.textContent =
            "Posisi penjemputan menggunakan lokasi Anda sekarang.";

        },


        function(error) {

          pickupMenggunakanGPS = false;

          pickupLat = null;
          pickupLng = null;


          status.textContent =
            "GPS belum berhasil: " +
            error.message;

        },


        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 5000
        }

      );
    }


    // ==========================================
    // JIKA PENUMPANG MENGUBAH PICKUP MANUAL
    // ==========================================

    document
      .getElementById("pickup")
      .addEventListener("input", function() {

        pickupMenggunakanGPS = false;

        pickupLat = null;
        pickupLng = null;

      });


    // ==========================================
    // PILIH KENDARAAN
    // ==========================================

    function pilihKendaraan(jenis) {

      kendaraanDipilih = jenis;


      const bikeCard =
        document.getElementById("bikeCard");

      const carCard =
        document.getElementById("carCard");


      bikeCard.classList.toggle(
        "selected",
        jenis === "BIKE"
      );

      carCard.classList.toggle(
        "selected",
        jenis === "MOBIL"
      );


      document.getElementById(
        "bikeCheck"
      ).textContent =
        jenis === "BIKE"
          ? "✓"
          : "○";


      document.getElementById(
        "carCheck"
      ).textContent =
        jenis === "MOBIL"
          ? "✓"
          : "○";


      document.getElementById(
        "status"
      ).textContent =
        "Kendaraan dipilih: " +
        jenis +
        ". Lengkapi lokasi dan tujuan perjalanan.";

    }


    // ==========================================
    // FOKUS TUJUAN
    // ==========================================

    function fokusTujuan() {

      document
        .getElementById("destination")
        .focus();

    }


    // ==========================================
    // GEOCODING ALAMAT
    // ==========================================

    async function cariKoordinat(alamat) {

      const url =
        "https://nominatim.openstreetmap.org/search" +
        "?format=json" +
        "&limit=1" +
        "&countrycodes=id" +
        "&q=" +
        encodeURIComponent(alamat);


      const response =
        await fetch(url, {
          headers: {
            "Accept": "application/json"
          }
        });


      if (!response.ok) {

        throw new Error(
          "Gagal mencari koordinat lokasi."
        );

      }


      const hasil =
        await response.json();


      if (!hasil.length) {

        throw new Error(
          "Lokasi tidak ditemukan: " +
          alamat
        );

      }


      return {

        lat: Number(
          hasil[0].lat
        ),

        lng: Number(
          hasil[0].lon
        )

      };

    }


    // ==========================================
    // PERIKSA PESANAN
    // ==========================================

    async function periksaPesanan() {

      const pickupInput =
        document.getElementById("pickup");

      const destinationInput =
        document.getElementById("destination");

      const status =
        document.getElementById("status");


      const pickup =
        pickupInput.value.trim();

      const destination =
        destinationInput.value.trim();


      // ----------------------------------------
      // CEK KENDARAAN
      // ----------------------------------------

      if (!kendaraanDipilih) {

        status.textContent =
          "Silakan pilih BIKE atau MOBIL terlebih dahulu.";

        return;

      }


      // ----------------------------------------
      // CEK INPUT
      // ----------------------------------------

      if (!pickup || !destination) {

        status.textContent =
          "Lengkapi lokasi penjemputan dan tujuan perjalanan.";

        return;

      }


      // ----------------------------------------
      // CEK FIREBASE
      // ----------------------------------------

      if (
        typeof window.kirimPesananKeFirebase !==
        "function"
      ) {

        status.textContent =
          "Menghubungkan ke server. Coba lagi sebentar.";

        return;

      }


      try {

        // ======================================
        // PICKUP
        // ======================================

        status.textContent =
          "Menentukan lokasi penjemputan...";


        /*
         * Jika tombol "Posisi saya" digunakan,
         * pickupLat dan pickupLng sudah tersedia.
         */

        if (
          pickupMenggunakanGPS &&
          pickupLat !== null &&
          pickupLng !== null
        ) {

          // Tidak perlu geocoding.
          // Koordinat GPS langsung digunakan.

        } else {

          /*
           * Jika penumpang mengetik alamat pickup,
           * sistem mencari koordinat alamat tersebut.
           */

          const lokasiPickup =
            await cariKoordinat(pickup);


          pickupLat =
            lokasiPickup.lat;

          pickupLng =
            lokasiPickup.lng;

        }


        // ======================================
        // TUJUAN
        // ======================================

        status.textContent =
          "Menentukan koordinat tujuan...";


        const lokasiTujuan =
          await cariKoordinat(destination);


        tujuanLat =
          lokasiTujuan.lat;

        tujuanLng =
          lokasiTujuan.lng;


        // ======================================
        // KIRIM KE FIREBASE
        // ======================================

        status.textContent =
          "Mengirim pesanan...";


        await window.kirimPesananKeFirebase({

          pickup:
            pickupMenggunakanGPS
              ? "Posisi saya sekarang"
              : pickup,

          pickupLat:
            pickupLat,

          pickupLng:
            pickupLng,

          destination:
            destination,

          tujuanLat:
            tujuanLat,

          tujuanLng:
            tujuanLng,

          vehicle:
            kendaraanDipilih

        });

      }


      catch (error) {

        console.error(
          "Kesalahan pesanan:",
          error
        );


        status.textContent =
          "Lokasi tidak berhasil ditemukan. " +
          "Periksa kembali alamat penjemputan dan tujuan.";

      }

    }

  </script>


  <!-- ===================================================== -->
  <!-- FIREBASE -->
  <!-- ===================================================== -->

  <script type="module">

    import {
      initializeApp,
      getApps
    }
    from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged,
      signOut
    }
    from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    import {
      getDatabase,
      ref,
      push,
      set,
      onValue,
      serverTimestamp
    }
    from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


    // ==========================================
    // FIREBASE CONFIG
    // ==========================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyCVfaUs8dmsr6n4oeb9WKGAlfsZ4nVfE",

      authDomain:
        "nexx-simulasi.firebaseapp.com",

      databaseURL:
        "https://nexx-simulasi-default-rtdb.asia-southeast1.firebasedatabase.app",

      projectId:
        "nexx-simulasi",

      storageBucket:
        "nexx-simulasi.firebasestorage.app",

      messagingSenderId:
        "741542128730",

      appId:
        "1:741542128730:web:d12c9246b9810216c0fc63"

    };


    const app =
      getApps().length
        ? getApps()[0]
        : initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getDatabase(app);


    // ==========================================
    // UID
    // ==========================================

    const UID_PENUMPANG =
      "d6nrr1YHgoXRBaCIuMMuQm7YZra2";


    const UID_PENGEMUDI =
      "p6iENr0Gt1gnSfdSv4FCz4brL803";


    let penggunaAktif = null;

    let berhentiMemantau = null;


    window.kirimPesananKeFirebase = null;


    // ==========================================
    // AUTH
    // ==========================================

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          window.location.replace(
            "Login-penumpang.html"
          );

          return;

        }


        if (user.uid === UID_PENGEMUDI) {

          window.location.replace(
            "NEXX-DRIVER.html"
          );

          return;

        }


        if (user.uid !== UID_PENUMPANG) {

          await signOut(auth);

          window.location.replace(
            "Login-penumpang.html"
          );

          return;

        }


        penggunaAktif = user;


        // ======================================
        // KIRIM PESANAN
        // ======================================

        window.kirimPesananKeFirebase =
          async function(data) {

            if (!penggunaAktif) {

              throw new Error(
                "Akun penumpang belum siap."
              );

            }


            // Hentikan listener lama

            if (berhentiMemantau) {

              berhentiMemantau();

              berhentiMemantau = null;

            }


            // Buat ID order baru

            const pesananRef =
              push(
                ref(db, "orders")
              );


            // ==================================
            // SIMPAN SATU ORDER DENGAN SEMUA DATA
            // ==================================

            await set(
              pesananRef,
              {

                passengerUid:
                  penggunaAktif.uid,

                driverUid:
                  "",


                // PICKUP

                pickup:
                  data.pickup,

                pickupLat:
                  data.pickupLat,

                pickupLng:
                  data.pickupLng,


                // TUJUAN

                destination:
                  data.destination,

                tujuanLat:
                  data.tujuanLat,

                tujuanLng:
                  data.tujuanLng,


                // KENDARAAN

                vehicle:
                  data.vehicle,


                // STATUS

                status:
                  "SEARCHING",


                // WAKTU

                createdAt:
                  serverTimestamp()

              }
            );


            // ==================================
            // SIMPAN ORDER ID
            // ==================================

            localStorage.setItem(
              "nexxActiveOrderId",
              pesananRef.key
            );


            // ==================================
            // PANTAU STATUS ORDER
            // ==================================

            berhentiMemantau =
              onValue(

                pesananRef,

                (snapshot) => {

                  if (!snapshot.exists()) {
                    return;
                  }


                  const pesanan =
                    snapshot.val();


                  const elemenStatus =
                    document.getElementById(
                      "status"
                    );


                  const statusPesanan =
                    pesanan.status;


                  // --------------------------------
                  // SEARCHING
                  // --------------------------------

                  if (
                    statusPesanan ===
                    "SEARCHING"
                  ) {

                    window.location.href =
                      "NEXX-CARI-DRIVER.html";

                    return;

                  }


                  // --------------------------------
                  // STATUS LAIN
                  // --------------------------------

                  const pesanStatus = {

                    ACCEPTED:
                      "Pesanan diterima! Pengemudi sedang bersiap.",

                    TO_PICKUP:
                      "Pengemudi sedang menuju lokasi penjemputan.",

                    IN_TRIP:
                      "Perjalanan sedang berlangsung.",

                    COMPLETED:
                      "Perjalanan selesai. Terima kasih!",

                    REJECTED:
                      "Pesanan ditolak. Silakan coba pesan kembali."

                  };


                  if (elemenStatus) {

                    elemenStatus.textContent =
                      pesanStatus[statusPesanan] ||
                      "Status pesanan: " +
                      statusPesanan;

                  }

                },


                (error) => {

                  console.error(
                    "Pemantauan pesanan gagal:",
                    error
                  );

                }

              );

          };


        // ======================================
        // PANTAU ORDER SEBELUMNYA
        // ======================================

        const orderId =
          localStorage.getItem(
            "nexxActiveOrderId"
          );


        if (orderId) {

          const pesananRef =
            ref(
              db,
              "orders/" + orderId
            );


          berhentiMemantau =
            onValue(

              pesananRef,

              (snapshot) => {

                if (!snapshot.exists()) {
                  return;
                }


                const data =
                  snapshot.val();


                const pesanStatus = {

                  SEARCHING:
                    "Mencari pengemudi...",

                  ACCEPTED:
                    "Pesanan diterima! Pengemudi sedang bersiap.",

                  TO_PICKUP:
                    "Pengemudi sedang menuju lokasi penjemputan.",

                  IN_TRIP:
                    "Perjalanan sedang berlangsung.",

                  COMPLETED:
                    "Perjalanan selesai. Terima kasih!",

                  REJECTED:
                    "Pesanan ditolak. Silakan coba pesan kembali."

                };


                const elemenStatus =
                  document.getElementById(
                    "status"
                  );


                if (elemenStatus) {

                  elemenStatus.textContent =
                    pesanStatus[data.status] ||
                    "Status pesanan: " +
                    data.status;

                }

              },


              (error) => {

                console.error(
                  "Gagal membaca pesanan:",
                  error
                );

              }

            );

        }

      }
    );

  </script>

</body>
</html>
