<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#7028F5"
>

<title>NEXX Penumpang</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f3fa;
  color:#202033;
}

.header{
  padding:30px 22px 34px;
  color:white;
  border-radius:0 0 30px 30px;

  background:
    radial-gradient(
      circle at 90% 15%,
      rgba(255,138,0,.75),
      transparent 27%
    ),
    radial-gradient(
      circle at 70% 100%,
      rgba(190,70,255,.65),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #351078 0%,
      #7028f5 48%,
      #29065f 100%
    );

  box-shadow:
    0 10px 28px rgba(91,32,190,.25);
}

.brand{
  font-size:36px;
  font-weight:900;
  letter-spacing:3px;
}

.brand span{
  color:#ff9a00;
}

.subtitle{
  margin-top:8px;
  font-size:14px;
}

.container{
  max-width:600px;
  margin:auto;
  padding:20px 16px 35px;
}

.card{
  background:white;
  border-radius:20px;
  padding:20px;
  margin-bottom:17px;

  box-shadow:
    0 5px 20px rgba(48,27,90,.07);
}

.card-title{
  font-size:22px;
  font-weight:900;
  margin-bottom:18px;
}

.section-title{
  margin-top:22px;
  margin-bottom:8px;

  font-size:15px;
  font-weight:900;
  color:#28144d;
}

.location-box{
  margin-bottom:15px;
}

.location-box input{
  width:100%;

  padding:15px;

  border:1px solid #ded7ed;
  border-radius:15px;

  background:#faf9ff;

  font-size:16px;

  outline:none;
}

.location-box input:focus{
  border-color:#7028f5;

  box-shadow:
    0 0 0 3px rgba(112,40,245,.10);
}

.gps-button{
  width:100%;

  margin-top:10px;

  padding:15px;

  border:none;
  border-radius:15px;

  background:#eee6ff;

  color:#5420a8;

  font-size:15px;
  font-weight:900;

  cursor:pointer;
}

.gps-button:active{
  transform:scale(.98);
}

.coordinate{
  margin-top:9px;

  padding:13px;

  border-radius:14px;

  background:#f7f4ff;

  color:#625977;

  font-size:13px;

  line-height:1.8;
}

.coordinate strong{
  color:#4f2499;
}

.vehicle-title{
  margin-top:24px;

  font-size:16px;
  font-weight:900;
}

.vehicle-options{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:12px;

  margin-top:12px;
}

.vehicle{
  padding:18px 10px;

  border:2px solid #e1d9f2;
  border-radius:18px;

  background:white;

  text-align:center;

  cursor:pointer;
}

.vehicle.selected{
  border-color:#7028f5;

  background:#f1e9ff;

  box-shadow:
    0 0 0 3px rgba(112,40,245,.08);
}

.vehicle-icon{
  font-size:42px;
}

.vehicle-name{
  margin-top:8px;

  font-size:17px;
  font-weight:900;
}

.vehicle-check{
  margin-top:8px;

  font-size:20px;
  font-weight:900;

  color:#7028f5;
}

.order-button{
  width:100%;

  margin-top:22px;

  padding:18px;

  border:none;
  border-radius:17px;

  background:
    linear-gradient(
      110deg,
      #ffad18,
      #ff8a00,
      #ff6500
    );

  color:white;

  font-size:17px;
  font-weight:900;

  cursor:pointer;
}

.order-button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.status{
  margin-top:15px;

  padding:14px;

  border-radius:13px;

  background:#f0ebff;

  color:#6021d1;

  font-size:13px;

  line-height:1.6;
}

#map{
  width:100%;
  height:380px;

  margin-top:15px;

  border-radius:18px;

  overflow:hidden;
}

.footer{
  text-align:center;

  color:#9691a6;

  font-size:12px;

  padding:10px;
}

@media(max-width:390px){

  .vehicle-icon{
    font-size:36px;
  }

  .card-title{
    font-size:20px;
  }

}

</style>

</head>

<body>

<header class="header">

  <div class="brand">
    NEX<span>X</span>
  </div>

  <div class="subtitle">
    Perjalanan lebih mudah dimulai di sini.
  </div>

</header>


<main class="container">


<section class="card">

  <div class="card-title">
    📍 Lokasi Perjalanan
  </div>


  <!-- =========================
       POSISI SAYA
  ========================== -->

  <div class="section-title">
    POSISI SAYA
  </div>

  <div class="location-box">

    <input
      id="posisiSaya"
      type="text"
      readonly
      placeholder="Menunggu lokasi GPS..."
    >

    <button
      id="gpsButton"
      class="gps-button"
      type="button"
    >
      📍 GUNAKAN POSISI SAYA
    </button>

  </div>

  <div
    id="koordinatSaya"
    class="coordinate"
  >

    Latitude: -<br>
    Longitude: -

  </div>


  <!-- =========================
       TITIK JEMPUT
  ========================== -->

  <div class="section-title">
    TITIK JEMPUT
  </div>

  <div class="location-box">

    <input
      id="pickup"
      type="text"
      placeholder="Contoh: Alun-alun Bumiayu"
      autocomplete="off"
    >

  </div>

  <div
    id="koordinatPickup"
    class="coordinate"
  >

    Latitude: -<br>
    Longitude: -

  </div>


  <!-- =========================
       TUJUAN
  ========================== -->

  <div class="section-title">
    TUJUAN
  </div>

  <div class="location-box">

    <input
      id="destination"
      type="text"
      placeholder="Masukkan tujuan perjalanan"
      autocomplete="off"
    >

  </div>

  <div
    id="koordinatTujuan"
    class="coordinate"
  >

    Latitude: -<br>
    Longitude: -

  </div>


  <!-- =========================
       KENDARAAN
  ========================== -->

  <div class="vehicle-title">
    PILIH KENDARAAN
  </div>

  <div class="vehicle-options">

    <button
      id="bikeButton"
      class="vehicle"
      type="button"
    >

      <div class="vehicle-icon">
        🏍️
      </div>

      <div class="vehicle-name">
        BIKE
      </div>

      <div
        id="bikeCheck"
        class="vehicle-check"
      >
        ○
      </div>

    </button>


    <button
      id="carButton"
      class="vehicle"
      type="button"
    >

      <div class="vehicle-icon">
        🚗
      </div>

      <div class="vehicle-name">
        MOBIL
      </div>

      <div
        id="carCheck"
        class="vehicle-check"
      >
        ○
      </div>

    </button>

  </div>


  <!-- =========================
       CARI DRIVER
  ========================== -->

  <button
    id="orderButton"
    class="order-button"
    type="button"
    disabled
  >
    CARI DRIVER →
  </button>


  <div
    id="status"
    class="status"
  >
    Menyiapkan halaman penumpang...
  </div>

</section>


<!-- =========================
     MAP
========================== -->

<section class="card">

  <div class="card-title">
    🗺️ Posisi & Navigasi
  </div>

  <div id="map"></div>

</section>


<div class="footer">
  NEXX SIMULATION · By SUHENDRO
</div>


</main>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script>

/* =====================================================
   DATA LOKASI
===================================================== */

let myLat = null;
let myLng = null;

let pickupLat = null;
let pickupLng = null;

let tujuanLat = null;
let tujuanLng = null;

let driverLat = null;
let driverLng = null;

let kendaraanDipilih = "";

let map = null;

let markerSaya = null;
let markerPickup = null;
let markerTujuan = null;
let markerDriver = null;

let routeDriverPickup = null;


/* =====================================================
   ELEMENT
===================================================== */

const posisiSaya =
  document.getElementById(
    "posisiSaya"
  );

const pickupInput =
  document.getElementById(
    "pickup"
  );

const destinationInput =
  document.getElementById(
    "destination"
  );

const gpsButton =
  document.getElementById(
    "gpsButton"
  );

const bikeButton =
  document.getElementById(
    "bikeButton"
  );

const carButton =
  document.getElementById(
    "carButton"
  );

const orderButton =
  document.getElementById(
    "orderButton"
  );

const statusBox =
  document.getElementById(
    "status"
  );


/* =====================================================
   STATUS
===================================================== */

function tampilkanStatus(pesan){

  statusBox.textContent =
    pesan;

}


/* =====================================================
   MAP
===================================================== */

function initMap(){

  if(typeof L === "undefined"){

    tampilkanStatus(
      "Peta belum berhasil dimuat."
    );

    return;

  }

  map =
    L.map("map").setView(
      [-7.8,110.4],
      13
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:
        "© OpenStreetMap"
    }
  ).addTo(map);

}


/* =====================================================
   ICON
===================================================== */

function buatIcon(
  warna,
  teks,
  ukuran=36
){

  return L.divIcon({

    className:"",

    html:`
      <div style="
        width:${ukuran}px;
        height:${ukuran}px;
        border-radius:50%;
        background:${warna};
        border:4px solid white;
        box-shadow:0 3px 12px rgba(0,0,0,.35);
        display:flex;
        align-items:center;
        justify-content:center;
        color:white;
        font-weight:900;
        font-size:${Math.round(ukuran/2.2)}px;
      ">
        ${teks}
      </div>
    `,

    iconSize:[
      ukuran,
      ukuran
    ],

    iconAnchor:[
      ukuran/2,
      ukuran/2
    ]

  });

}


/* =====================================================
   TAMPILKAN KOORDINAT
===================================================== */

function tampilkanKoordinat(){

  document.getElementById(
    "koordinatSaya"
  ).innerHTML =

    "Latitude: " +

    (
      myLat !== null
      ? myLat.toFixed(6)
      : "-"
    )

    +

    "<br>Longitude: " +

    (
      myLng !== null
      ? myLng.toFixed(6)
      : "-"
    );


  document.getElementById(
    "koordinatPickup"
  ).innerHTML =

    "Latitude: " +

    (
      pickupLat !== null
      ? pickupLat.toFixed(6)
      : "-"
    )

    +

    "<br>Longitude: " +

    (
      pickupLng !== null
      ? pickupLng.toFixed(6)
      : "-"
    );


  document.getElementById(
    "koordinatTujuan"
  ).innerHTML =

    "Latitude: " +

    (
      tujuanLat !== null
      ? tujuanLat.toFixed(6)
      : "-"
    )

    +

    "<br>Longitude: " +

    (
      tujuanLng !== null
      ? tujuanLng.toFixed(6)
      : "-"
    );

}


/* =====================================================
   GPS
===================================================== */

function ambilLokasiSaya(){

  if(
    !navigator.geolocation
  ){

    tampilkanStatus(
      "❌ Perangkat tidak mendukung GPS."
    );

    return;

  }


  tampilkanStatus(
    "📡 Sedang mengambil lokasi GPS..."
  );


  navigator.geolocation.getCurrentPosition(

    function(position){

      myLat =
        position.coords.latitude;

      myLng =
        position.coords.longitude;


      pickupLat =
        myLat;

      pickupLng =
        myLng;


      posisiSaya.value =
        "Posisi saya sekarang";


      pickupInput.value =
        "Posisi saya sekarang";


      tampilkanKoordinat();


      tampilkanMarkerSaya();


      tampilkanMarkerPickup();


      if(map){

        map.setView(
          [myLat,myLng],
          16
        );

      }


      tampilkanStatus(
        "✅ GPS berhasil ditemukan."
      );

    },

    function(error){

      let pesan =
        "GPS gagal.";

      if(error.code === 1){

        pesan =
          "❌ Izin lokasi ditolak. Aktifkan izin lokasi untuk browser.";

      }

      else if(error.code === 2){

        pesan =
          "❌ Lokasi belum tersedia. Pastikan GPS aktif.";

      }

      else if(error.code === 3){

        pesan =
          "❌ GPS terlalu lama mendapatkan lokasi.";

      }

      tampilkanStatus(
        pesan
      );

    },

    {
      enableHighAccuracy:true,
      timeout:20000,
      maximumAge:0
    }

  );

}


/* =====================================================
   MARKER SAYA
===================================================== */

function tampilkanMarkerSaya(){

  if(
    !map ||
    myLat === null ||
    myLng === null
  ){

    return;

  }


  const posisi =
    [myLat,myLng];


  if(markerSaya){

    markerSaya.setLatLng(
      posisi
    );

  }

  else{

    markerSaya =
      L.marker(
        posisi,
        {
          icon:
            buatIcon(
              "#7028F5",
              "●"
            )
        }
      )
      .addTo(map)
      .bindPopup(
        "Posisi saya"
      );

  }

}


/* =====================================================
   MARKER PICKUP
===================================================== */

function tampilkanMarkerPickup(){

  if(
    !map ||
    pickupLat === null ||
    pickupLng === null
  ){

    return;

  }


  const posisi =
    [pickupLat,pickupLng];


  if(markerPickup){

    markerPickup.setLatLng(
      posisi
    );

  }

  else{

    markerPickup =
      L.marker(
        posisi,
        {
          icon:
            buatIcon(
              "#7028F5",
              "A"
            )
        }
      )
      .addTo(map)
      .bindPopup(
        "Titik jemput"
      );

  }

}


/* =====================================================
   MARKER TUJUAN
===================================================== */

function tampilkanMarkerTujuan(){

  if(
    !map ||
    tujuanLat === null ||
    tujuanLng === null
  ){

    return;

  }


  const posisi =
    [tujuanLat,tujuanLng];


  if(markerTujuan){

    markerTujuan.setLatLng(
      posisi
    );

  }

  else{

    markerTujuan =
      L.marker(
        posisi,
        {
          icon:
            buatIcon(
              "#FF8A00",
              "B"
            )
        }
      )
      .addTo(map)
      .bindPopup(
        "Tujuan"
      );

  }

}


/* =====================================================
   MARKER DRIVER
===================================================== */

function tampilkanMarkerDriver(){

  if(
    !map ||
    driverLat === null ||
    driverLng === null
  ){

    return;

  }


  const posisi =
    [driverLat,driverLng];


  if(markerDriver){

    markerDriver.setLatLng(
      posisi
    );

  }

  else{

    markerDriver =
      L.marker(
        posisi,
        {
          icon:
            buatIcon(
              "#FF8A00",
              "🚗",
              42
            )
        }
      )
      .addTo(map)
      .bindPopup(
        "Posisi driver"
      );

  }

}


/* =====================================================
   GEOCODING
===================================================== */

async function cariKoordinat(
  alamat
){

  const url =
    "https://nominatim.openstreetmap.org/search" +

    "?format=json" +

    "&limit=1" +

    "&countrycodes=id" +

    "&q=" +

    encodeURIComponent(
      alamat
    );


  const response =
    await fetch(
      url,
      {
        headers:{
          "Accept":
            "application/json"
        }
      }
    );


  if(!response.ok){

    throw new Error(
      "Gagal mencari koordinat."
    );

  }


  const hasil =
    await response.json();


  if(
    !hasil ||
    hasil.length === 0
  ){

    throw new Error(
      "Lokasi tidak ditemukan."
    );

  }


  return {

    lat:
      parseFloat(
        hasil[0].lat
      ),

    lng:
      parseFloat(
        hasil[0].lon
      )

  };

}


/* =====================================================
   UPDATE PICKUP DARI ALAMAT
===================================================== */

async function prosesPickup(){

  const alamat =
    pickupInput.value.trim();


  if(!alamat){

    return;

  }


  if(
    alamat ===
    "Posisi saya sekarang" &&
    myLat !== null
  ){

    pickupLat =
      myLat;

    pickupLng =
      myLng;

    tampilkanKoordinat();

    tampilkanMarkerPickup();

    return;

  }


  try{

    tampilkanStatus(
      "📍 Mencari koordinat titik jemput..."
    );


    const hasil =
      await cariKoordinat(
        alamat
      );


    pickupLat =
      hasil.lat;

    pickupLng =
      hasil.lng;


    tampilkanKoordinat();

    tampilkanMarkerPickup();


    tampilkanStatus(
      "✅ Titik jemput berhasil ditemukan."
    );

  }

  catch(error){

    tampilkanStatus(
      "❌ " +
      error.message
    );

  }

}


/* =====================================================
   UPDATE TUJUAN
===================================================== */

async function prosesTujuan(){

  const alamat =
    destinationInput.value.trim();


  if(!alamat){

    return;

  }


  try{

    tampilkanStatus(
      "📍 Mencari koordinat tujuan..."
    );


    const hasil =
      await cariKoordinat(
        alamat
      );


    tujuanLat =
      hasil.lat;

    tujuanLng =
      hasil.lng;


    tampilkanKoordinat();

    tampilkanMarkerTujuan();


    tampilkanStatus(
      "✅ Koordinat tujuan berhasil ditemukan."
    );

  }

  catch(error){

    tampilkanStatus(
      "❌ " +
      error.message
    );

  }

}


/* =====================================================
   KENDARAAN
===================================================== */

function pilihKendaraan(
  jenis
){

  kendaraanDipilih =
    jenis;


  bikeButton.classList.toggle(
    "selected",
    jenis === "BIKE"
  );


  carButton.classList.toggle(
    "selected",
    jenis === "MOBIL"
  );


  document.getElementById(
    "bikeCheck"
  ).textContent =
    jenis === "BIKE"
      ? "✓"
      : "○";


  document.getElementById(
    "carCheck"
  ).textContent =
    jenis === "MOBIL"
      ? "✓"
      : "○";


  tampilkanStatus(
    "Kendaraan dipilih: " +
    jenis
  );

}


/* =====================================================
   VALIDASI PESANAN
===================================================== */

async function periksaPesanan(){

  const pickup =
    pickupInput.value.trim();


  const destination =
    destinationInput.value.trim();


  if(!pickup){

    tampilkanStatus(
      "Masukkan titik jemput."
    );

    return;

  }


  if(!destination){

    tampilkanStatus(
      "Masukkan tujuan perjalanan."
    );

    return;

  }


  if(!kendaraanDipilih){

    tampilkanStatus(
      "Pilih BIKE atau MOBIL."
    );

    return;

  }


  if(
    pickupLat === null ||
    pickupLng === null
  ){

    await prosesPickup();

  }


  if(
    tujuanLat === null ||
    tujuanLng === null
  ){

    await prosesTujuan();

  }


  if(
    pickupLat === null ||
    pickupLng === null ||
    tujuanLat === null ||
    tujuanLng === null
  ){

    tampilkanStatus(
      "❌ Koordinat perjalanan belum lengkap."
    );

    return;

  }


  if(
    typeof window.kirimPesananKeFirebase
    !== "function"
  ){

    tampilkanStatus(
      "⏳ Firebase belum siap. Tunggu sebentar."
    );

    return;

  }


  try{

    orderButton.disabled =
      true;


    tampilkanStatus(
      "📡 Membuat pesanan..."
    );


    await window.kirimPesananKeFirebase({

      pickup:
        pickup,

      pickupLat:
        pickupLat,

      pickupLng:
        pickupLng,

      destination:
        destination,

      tujuanLat:
        tujuanLat,

      tujuanLng:
        tujuanLng,

      myLat:
        myLat,

      myLng:
        myLng,

      vehicle:
        kendaraanDipilih

    });


    tampilkanStatus(
      "🔎 Pesanan berhasil dibuat. Mencari driver..."
    );


  }

  catch(error){

    orderButton.disabled =
      false;


    console.error(
      error
    );


    tampilkanStatus(
      "❌ " +
      (
        error.message ||
        "Pesanan gagal dibuat."
      )
    );

  }

}


/* =====================================================
   EVENT TOMBOL
===================================================== */

gpsButton.addEventListener(
  "click",
  ambilLokasiSaya
);


bikeButton.addEventListener(
  "click",
  function(){

    pilihKendaraan(
      "BIKE"
    );

  }
);


carButton.addEventListener(
  "click",
  function(){

    pilihKendaraan(
      "MOBIL"
    );

  }
);


orderButton.addEventListener(
  "click",
  periksaPesanan
);


/* =====================================================
   EVENT INPUT LOKASI
===================================================== */

pickupInput.addEventListener(
  "change",
  prosesPickup
);


pickupInput.addEventListener(
  "blur",
  function(){

    if(
      pickupInput.value.trim()
    ){

      prosesPickup();

    }

  }
);


destinationInput.addEventListener(
  "change",
  prosesTujuan
);


destinationInput.addEventListener(
  "blur",
  function(){

    if(
      destinationInput.value.trim()
    ){

      prosesTujuan();

    }

  }
);


/* =====================================================
   MULAI
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    initMap();

    tampilkanKoordinat();

/* =====================================================
   PANTAU ORDER
===================================================== */

function mulaiPantauOrder(
  orderId
){

  if(
    berhentiPantauOrder
  ){

    berhentiPantauOrder();

  }


  const orderRef =
    ref(
      db,
      "orders/" +
      orderId
    );


  berhentiPantauOrder =
    onValue(

      orderRef,

      function(snapshot){

        if(
          !snapshot.exists()
        ){

          return;

        }


        const order =
          snapshot.val();


        if(
          order.pickupLat !==
          undefined
        ){

          window.pickupLat =
            order.pickupLat;

          window.pickupLng =
            order.pickupLng;

        }


        if(
          order.tujuanLat !==
          undefined
        ){

          window.tujuanLat =
            order.tujuanLat;

          window.tujuanLng =
            order.tujuanLng;

        }

      }

    );

}

===================================================== */

function pantauDriver(){

  if(
    !penggunaAktif

  if(
