<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NEXX DRIVER</title>

<meta name="theme-color" content="#111827">

<!-- =========================================================
     LEAFLET
========================================================= -->

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #080b14;
  color: #ffffff;
}

body {
  overflow-x: hidden;
}

/* =========================================================
   APP
========================================================= */

.app {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  background:
    radial-gradient(
      circle at top right,
      rgba(123,47,247,0.18),
      transparent 35%
    ),
    #080b14;
}

/* =========================================================
   HEADER
========================================================= */

.header {
  padding: 20px 18px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: flex;
  justify-content: center;
  align-items: center;

  background:
    linear-gradient(
      135deg,
      #7B2FF7,
      #FF8A00
    );

  font-size: 21px;
  font-weight: 900;
  box-shadow:
    0 8px 25px rgba(123,47,247,0.35);
}

.brand-text h1 {
  margin: 0;
  font-size: 18px;
}

.brand-text p {
  margin: 3px 0 0;
  color: #9ca3af;
  font-size: 11px;
}

/* =========================================================
   DRIVER STATUS
========================================================= */

.status-card {
  margin: 8px 16px 14px;
  padding: 15px;
  border-radius: 20px;

  background: rgba(17,24,39,0.92);
  border: 1px solid rgba(255,255,255,0.07);

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.status-info {
  display: flex;
  align-items: center;
  gap: 11px;
}

.status-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ef4444;
  box-shadow: 0 0 10px rgba(239,68,68,0.4);
}

.status-dot.active {
  background: #22c55e;
  box-shadow: 0 0 12px rgba(34,197,94,0.7);
}

.status-title {
  margin: 0;
  font-size: 14px;
  font-weight: 800;
}

.status-title.online {
  color: #22c55e;
}

.status-title.offline {
  color: #ef4444;
}

.status-desc {
  margin: 3px 0 0;
  color: #9ca3af;
  font-size: 11px;
}

.status-toggle {
  width: 56px;
  height: 30px;
  border: 0;
  border-radius: 20px;
  padding: 3px;
  background: #374151;
  cursor: pointer;
  transition: 0.25s;
}

.status-toggle span {
  display: block;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #ffffff;
  transition: 0.25s;
}

.status-toggle.active {
  background: #22c55e;
}

.status-toggle.active span {
  transform: translateX(26px);
}

/* =========================================================
   GPS CARD
========================================================= */

.gps-card {
  margin: 0 16px 14px;
  padding: 13px 15px;
  border-radius: 16px;

  background: #111827;
  border: 1px solid rgba(255,255,255,0.06);

  display: flex;
  align-items: center;
  gap: 10px;
}

.gps-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #6b7280;
}

.gps-dot.active {
  background: #22c55e;
  box-shadow: 0 0 10px rgba(34,197,94,0.8);
}

.gps-text {
  font-size: 12px;
  color: #d1d5db;
}

/* =========================================================
   MAP
========================================================= */

.map-container {
  margin: 0 16px 16px;
  height: 280px;

  border-radius: 22px;
  overflow: hidden;

  border: 1px solid rgba(255,255,255,0.08);

  box-shadow:
    0 15px 35px rgba(0,0,0,0.35);
}

#map {
  width: 100%;
  height: 100%;
}

/* =========================================================
   ORDER CARD
========================================================= */

.order-card {
  margin: 0 16px 18px;
  padding: 18px;

  border-radius: 22px;

  background:
    linear-gradient(
      145deg,
      rgba(22,25,42,0.98),
      rgba(13,16,28,0.98)
    );

  border: 1px solid rgba(123,47,247,0.25);

  box-shadow:
    0 15px 40px rgba(0,0,0,0.3);
}

.order-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 17px;
}

.order-title {
  font-size: 16px;
  font-weight: 800;
}

.order-badge {
  padding: 6px 9px;
  border-radius: 10px;

  background: rgba(255,138,0,0.15);
  color: #FF8A00;

  font-size: 10px;
  font-weight: 800;
}

.location-row {
  display: flex;
  gap: 11px;
  margin-bottom: 15px;
}

.location-icon {
  width: 32px;
  height: 32px;
  min-width: 32px;

  display: flex;
  justify-content: center;
  align-items: center;

  border-radius: 11px;

  background: rgba(123,47,247,0.16);
  color: #a970ff;

  font-size: 15px;
}

.location-info {
  min-width: 0;
}

.location-label {
  color: #9ca3af;
  font-size: 10px;
  margin-bottom: 4px;
}

.location-value {
  font-size: 13px;
  line-height: 1.4;
  word-break: break-word;
}

.passenger {
  padding: 14px 0;
  margin-top: 5px;

  border-top: 1px solid rgba(255,255,255,0.06);
}

.passenger-name {
  font-size: 14px;
  font-weight: 800;
}

.passenger-rating {
  margin-top: 4px;
  color: #fbbf24;
  font-size: 12px;
}

.order-state {
  margin-top: 10px;
  color: #9ca3af;
  font-size: 11px;
}

/* =========================================================
   BUTTON
========================================================= */

.action-button {
  width: 100%;
  border: 0;
  border-radius: 15px;

  padding: 14px;

  color: #ffffff;
  font-size: 14px;
  font-weight: 800;

  cursor: pointer;
  transition: 0.2s;
}

.action-button:active {
  transform: scale(0.98);
}

.button-orange {
  background:
    linear-gradient(
      135deg,
      #FF8A00,
      #ff6500
    );

  box-shadow:
    0 8px 20px rgba(255,138,0,0.22);
}

.button-violet {
  background:
    linear-gradient(
      135deg,
      #7B2FF7,
      #6120d8
    );

  box-shadow:
    0 8px 20px rgba(123,47,247,0.25);
}

.button-green {
  background:
    linear-gradient(
      135deg,
      #22c55e,
      #16a34a
    );
}

.button-red {
  background:
    linear-gradient(
      135deg,
      #ef4444,
      #dc2626
    );
}

.button-gray {
  background: #374151;
}

.button-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}

/* =========================================================
   EMPTY ORDER
========================================================= */

.empty-order {
  text-align: center;
  padding: 25px 10px;
  color: #9ca3af;
}

.empty-icon {
  font-size: 35px;
  margin-bottom: 10px;
}

.empty-title {
  color: #ffffff;
  font-weight: 800;
  font-size: 14px;
}

.empty-text {
  margin-top: 6px;
  font-size: 11px;
  line-height: 1.5;
}

/* =========================================================
   TOAST
========================================================= */

.toast {
  position: fixed;
  left: 50%;
  bottom: 25px;

  transform:
    translateX(-50%)
    translateY(20px);

  width: calc(100% - 40px);
  max-width: 460px;

  padding: 13px 15px;

  border-radius: 14px;

  background: rgba(17,24,39,0.96);
  border: 1px solid rgba(255,255,255,0.08);

  color: #ffffff;
  text-align: center;

  font-size: 12px;

  opacity: 0;
  pointer-events: none;

  transition: 0.25s;

  z-index: 9999;
}

.toast.show {
  opacity: 1;
  transform:
    translateX(-50%)
    translateY(0);
}

/* =========================================================
   MAP STATUS
========================================================= */

.map-status {
  position: absolute;
  z-index: 500;

  margin: 10px;

  padding: 7px 10px;

  border-radius: 10px;

  background: rgba(8,11,20,0.85);
  color: #ffffff;

  font-size: 10px;
  font-weight: 800;
}

/* =========================================================
   DESKTOP
========================================================= */

@media (min-width: 700px) {

  .app {
    max-width: 700px;
  }

  .map-container {
    height: 340px;
  }

}

</style>

</head>

<body>

<div class="app">

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="header">

    <div class="brand">

      <div class="logo">
        N
      </div>

      <div class="brand-text">

        <h1>NEXX DRIVER</h1>

        <p>
          Driver Simulation System
        </p>

      </div>

    </div>

  </header>


  <!-- =====================================================
       STATUS ONLINE / OFFLINE
  ====================================================== -->

  <section class="status-card">

    <div class="status-info">

      <div
        id="statusDot"
        class="status-dot">
      </div>

      <div>

        <h2
          id="statusTitle"
          class="status-title offline">
          OFFLINE
        </h2>

        <p
          id="statusDesc"
          class="status-desc">
          Anda sedang tidak menerima pesanan
        </p>

      </div>

    </div>

    <button
      id="statusToggle"
      class="status-toggle"
      type="button"
      onclick="ubahStatusOnline()">

      <span></span>

    </button>

  </section>


  <!-- =====================================================
       GPS STATUS
  ====================================================== -->

  <section class="gps-card">

    <div
      id="gpsDot"
      class="gps-dot">
    </div>

    <div
      id="gpsText"
      class="gps-text">

      GPS belum aktif

    </div>

  </section>


  <!-- =====================================================
       MAP
  ====================================================== -->

  <section class="map-container">

    <div
      id="mapStatus"
      class="map-status">

      GPS MENUNGGU

    </div>

    <div id="map"></div>

  </section>


  <!-- =====================================================
       ORDER
  ====================================================== -->

  <section class="order-card">

    <div class="order-header">

      <div class="order-title">
        Pesanan
      </div>

      <div
        id="orderBadge"
        class="order-badge">

        MENUNGGU

      </div>

    </div>


    <!-- PESANAN KOSONG -->

    <div
      id="emptyOrder"
      class="empty-order">

      <div class="empty-icon">
        🚗
      </div>

      <div class="empty-title">
        Belum ada pesanan
      </div>

      <div class="empty-text">
        Aktifkan mode ONLINE untuk menerima
        pesanan penumpang.
      </div>

    </div>


    <!-- ISI PESANAN -->

    <div
      id="orderContent"
      style="display:none;">

      <!-- PICKUP -->

      <div class="location-row">

        <div class="location-icon">
          A
        </div>

        <div class="location-info">

          <div class="location-label">
            JEMPUT
          </div>

          <div
            id="pickupAddress"
            class="location-value">
            -
          </div>

        </div>

      </div>


      <!-- DESTINATION -->

      <div class="location-row">

        <div class="location-icon">
          B
        </div>

        <div class="location-info">

          <div class="location-label">
            TUJUAN
          </div>

          <div
            id="destinationAddress"
            class="location-value">
            -
          </div>

        </div>

      </div>


      <!-- PASSENGER -->

      <div class="passenger">

        <div
          class="passenger-name">
          Penumpang NEXX
        </div>

        <div
          class="passenger-rating">
          ★ 4.9
        </div>

        <div
          id="orderState"
          class="order-state">
          Penumpang sedang mencari pengemudi.
        </div>

      </div>


      <!-- ACTION BUTTONS -->

      <button
        id="acceptButton"
        class="action-button button-orange"
        type="button"
        onclick="terimaPesanan()">

        TERIMA PESANAN

      </button>


      <div
        id="rejectStartRow"
        class="button-row">

        <button
          class="action-button button-gray"
          type="button"
          onclick="tolakPesanan()">

          TOLAK

        </button>

        <button
          id="startButton"
          class="action-button button-violet"
          type="button"
          onclick="mulaiPerjalanan()"
          style="display:none;">

          MULAI PERJALANAN

        </button>

      </div>


      <button
        id="completeButton"
        class="action-button button-green"
        type="button"
        onclick="selesaikanPerjalanan()"
        style="display:none;margin-top:12px;">

        SELESAIKAN PERJALANAN

      </button>

    </div>

  </section>

</div>


<!-- =========================================================
     TOAST
========================================================= -->

<div
  id="toast"
  class="toast">
</div>


<!-- =========================================================
     LEAFLET
========================================================= -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<!-- =========================================================
     JAVASCRIPT UTAMA HALAMAN
========================================================= -->

<script>

/* =========================================================
   VARIABEL GLOBAL HALAMAN
========================================================= */

let online = false;

window.online = false;

let kendaraan = "MOTOR";

let statusPesanan = "MENUNGGU";

let posisiSaya = null;

let markerSaya = null;

let markerJemput = null;

let markerTujuan = null;

let garisRute = null;

let gpsWatchId = null;

let gpsAktif = false;

let petaSiap = false;

let toastTimer = null;


/* =========================================================
   VARIABEL PESANAN FIREBASE
========================================================= */

window.pesananAktifId = null;

window.pesananAktif = null;


/* =========================================================
   TITIK DEMO
========================================================= */

const POSISI_AWAL = [
  -7.242,
  108.998
];

const TITIK_JEMPUT = [
  -7.244,
  108.991
];

const TITIK_TUJUAN = [
  -7.246,
  109.005
];


/* =========================================================
   MAP
========================================================= */

const map = L.map("map");

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap"
  }
).addTo(map);

map.setView(
  POSISI_AWAL,
  15
);

petaSiap = true;


/* =========================================================
   ICON DRIVER
========================================================= */

const iconSaya = L.divIcon({

  className: "",

  html: `
    <div style="
      width:42px;
      height:42px;
      border-radius:50%;
      background:#7B2FF7;
      border:4px solid #ffffff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
      box-shadow:0 4px 15px rgba(0,0,0,.35);
    ">
      🚗
    </div>
  `,

  iconSize: [42,42],

  iconAnchor: [21,21]

});


/* =========================================================
   MARKER POSISI DRIVER
========================================================= */

function perbaruiMarkerSaya(lat, lon) {

  posisiSaya = [
    lat,
    lon
  ];

  if (!markerSaya) {

    markerSaya = L.marker(
      [lat, lon],
      {
        icon: iconSaya
      }
    ).addTo(map);

  } else {

    markerSaya.setLatLng([
      lat,
      lon
    ]);

  }

}


/* =========================================================
   MARKER JEMPUT
========================================================= */

function tampilkanMarkerJemput() {

  if (markerJemput) {
    map.removeLayer(markerJemput);
  }

  markerJemput =
    L.marker(TITIK_JEMPUT)
      .addTo(map)
      .bindPopup("Titik Jemput");

}


/* =========================================================
   MARKER TUJUAN
========================================================= */

function tampilkanMarkerTujuan() {

  if (markerTujuan) {
    map.removeLayer(markerTujuan);
  }

  markerTujuan =
    L.marker(TITIK_TUJUAN)
      .addTo(map)
      .bindPopup("Tujuan");

}


/* =========================================================
   HAPUS MARKER PESANAN
========================================================= */

function hapusMarkerPesanan() {

  if (markerJemput) {
    map.removeLayer(markerJemput);
    markerJemput = null;
  }

  if (markerTujuan) {
    map.removeLayer(markerTujuan);
    markerTujuan = null;
  }

  if (garisRute) {
    map.removeLayer(garisRute);
    garisRute = null;
  }

}


/* =========================================================
   TAMPILKAN PESAN
========================================================= */

function tampilkanPesan(pesan) {

  const toast =
    document.getElementById("toast");

  toast.textContent = pesan;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(
      function() {

        toast.classList.remove("show");

      },
      2500
    );

}


/* =========================================================
   UPDATE TAMPILAN PESANAN
========================================================= */

function tampilkanPesanan() {

  const empty =
    document.getElementById("emptyOrder");

  const content =
    document.getElementById("orderContent");

  if (
    window.pesananAktif &&
    window.pesananAktifId
  ) {

    empty.style.display = "none";

    content.style.display = "block";

  } else {

    empty.style.display = "block";

    content.style.display = "none";

  }

}


/* =========================================================
   STATUS ONLINE / OFFLINE
========================================================= */

function ubahStatusOnline() {

  online = !online;

  window.online = online;

  const tombol =
    document.getElementById(
      "statusToggle"
    );

  const judul =
    document.getElementById(
      "statusTitle"
    );

  const deskripsi =
    document.getElementById(
      "statusDesc"
    );

  const dot =
    document.getElementById(
      "statusDot"
    );


  tombol.classList.toggle(
    "active",
    online
  );


  dot.classList.toggle(
    "active",
    online
  );


  if (online) {

    judul.textContent = "ONLINE";

    judul.className =
      "status-title online";

    deskripsi.textContent =
      "Siap menerima pesanan";

    aktifkanGPS();

    tampilkanPesan(
      "Mode ONLINE aktif."
    );

    if (
      window.statusPesananLocal ===
      "MENUNGGU"
    ) {
      tampilkanPesanan();
    }

  } else {

    judul.textContent = "OFFLINE";

    judul.className =
      "status-title offline";

    deskripsi.textContent =
      "Anda sedang tidak menerima pesanan";

    hentikanGPS();

    tampilkanPesan(
      "Mode OFFLINE aktif."
    );

  }

}


/* =========================================================
   GPS
========================================================= */

function aktifkanGPS() {

  if (!navigator.geolocation) {

    tampilkanPesan(
      "Browser ini tidak mendukung GPS."
    );

    return;

  }


  if (!window.isSecureContext) {

    tampilkanPesan(
      "GPS memerlukan HTTPS atau localhost."
    );

    return;

  }


  if (gpsWatchId !== null) {

    return;

  }


  document.getElementById(
    "gpsText"
  ).textContent =
    "Meminta lokasi GPS...";


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;

      gpsAktif = true;

      perbaruiMarkerSaya(
        lat,
        lon
      );

      map.setView(
        [lat, lon],
        16
      );

      document.getElementById(
        "gpsText"
      ).textContent =
        "GPS aktif · Posisi ditemukan";

      document.getElementById(
        "gpsDot"
      ).classList.add("active");

      document.getElementById(
        "mapStatus"
      ).textContent =
        "GPS AKTIF";

      tampilkanPesan(
        "Lokasi GPS berhasil ditemukan."
      );

    },

    function(error) {

      let pesan =
        "Lokasi GPS belum berhasil diperoleh.";

      if (error.code === 1) {

        pesan =
          "Izin lokasi ditolak. Izinkan akses lokasi browser.";

      } else if (error.code === 2) {

        pesan =
          "Posisi belum tersedia. Periksa GPS dan sinyal.";

      } else if (error.code === 3) {

        pesan =
          "GPS terlalu lama merespons. Coba lagi.";

      }


      document.getElementById(
        "gpsText"
      ).textContent =
        "GPS belum tersedia";

      tampilkanPesan(pesan);

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );


  gpsWatchId =
    navigator.geolocation.watchPosition(

      function(position) {

        const lat =
          position.coords.latitude;

        const lon =
          position.coords.longitude;

        gpsAktif = true;

        perbaruiMarkerSaya(
          lat,
          lon
        );

        document.getElementById(
          "gpsText"
        ).textContent =
          "GPS aktif · Lokasi diperbarui";

        document.getElementById(
          "gpsDot"
        ).classList.add("active");

        document.getElementById(
          "mapStatus"
        ).textContent =
          "GPS LIVE";

      },

      function(error) {

        if (error.code === 1) {

          document.getElementById(
            "gpsText"
          ).textContent =
            "Izin GPS perlu diperiksa";

        } else {

          document.getElementById(
            "gpsText"
          ).textContent =
            "Menunggu sinyal GPS";

        }

        document.getElementById(
          "gpsDot"
        ).classList.remove("active");

      },

      {
        enableHighAccuracy: true,
        maximumAge: 2000,
        timeout: 20000
      }

    );

}


/* =========================================================
   HENTIKAN GPS
========================================================= */

function hentikanGPS() {

  if (gpsWatchId !== null) {

    navigator.geolocation.clearWatch(
      gpsWatchId
    );

    gpsWatchId = null;

  }

  gpsAktif = false;

  document.getElementById(
    "gpsText"
  ).textContent =
    "GPS tidak aktif";

  document.getElementById(
    "gpsDot"
  ).classList.remove("active");

  document.getElementById(
    "mapStatus"
  ).textContent =
    "GPS OFFLINE";

}


/* =========================================================
   TAMPILKAN PESANAN FIREBASE
========================================================= */

function updateUIStatusOrder(status) {

      "orderBadge"
    );

  const state =
    document.getElementById(
      "orderState"
    );

  const accept =
    document.getElementById(
      "acceptButton"
    );

  const row =
    document.getElementById(
      "rejectStartRow"
    );

  const start =
    document.getElementById(
      "startButton"
    );

  const complete =
    document.getElementById(
      "completeButton"
    );


  accept.style.display =
    "none";

  row.style.display =
    "none";

  start.style.display =
    "none";

  complete.style.display =
    "none";


  if (status === "SEARCHING") {

    badge.textContent =
      "PESANAN BARU";

    state.textContent =
      "Penumpang sedang mencari pengemudi.";

    accept.style.display =
      "block";

    row.style.display =
      "grid";

    start.style.display =
      "none";

  }


  else if (status === "ACCEPTED") {

    badge.textContent =
      "DITERIMA";

    state.textContent =
      "Pesanan diterima. Menuju titik penjemputan.";

    start.style.display =
      "block";

  }


  else if (status === "TO_PICKUP") {

    badge.textContent =
      "MENUJU JEMPUT";

    state.textContent =
      "Pengemudi sedang menuju lokasi penjemputan.";

    start.style.display =
      "none";

  }


  else if (status === "IN_TRIP") {

    badge.textContent =
      "DALAM PERJALANAN";

    state.textContent =
      "Perjalanan bersama penumpang sedang berlangsung.";

    complete.style.display =
      "block";

  }


  else if (status === "COMPLETED") {

    badge.textContent =
      "SELESAI";

    state.textContent =
      "Perjalanan telah selesai.";

  }


  else if (status === "REJECTED") {

    badge.textContent =
      "DITOLAK";

    state.textContent =
      "Pesanan ditolak.";

  }

}

    /*
     * AKUN PENUMPANG
     */

    if (
      user.uid ===
      UID_PENUMPANG
    ) {

      window.location.replace(
        "NEXX-PENUMPANG.html"
      );

      return;

    }


    /*
     * BUKAN AKUN DRIVER
     */

    if (
      user.uid !==
      UID_PENGEMUDI
    ) {

      await signOut(auth);

      window.location.replace(
        "Login-penumpang.html"
      );

      return;

    }


    /*
     * DRIVER VALID
     */

    pengemudiAktif =
      user;


    console.log(
      "NEXX DRIVER LOGIN:",
      user.uid
    );


    /*
     * Pantau pesanan realtime.
     * HANYA SATU listener orders.
     */

    mulaiPantauPesanan();


    /*
     * Siapkan GPS Firebase.
     */

    mulaiKirimLokasiDriver();


    /*
     * Presence awal OFFLINE.
     */

    await tulisStatusOnline(
      false
    );


    /*
     * Jika koneksi browser putus,
     * Firebase mencoba mengubah
     * status presence.
     */

    const presenceRef =
      ref(
        db,
        "driverPresence/" +
        user.uid
      );


    onDisconnect(
      presenceRef
    ).set({

      uid:
        user.uid,

      online:
        false,

      updatedAt:
        serverTimestamp()

    });


    tampilkanPesan(
      "Driver siap."
    );

  }

);


/* =========================================================
   PANTAU PERUBAHAN ONLINE/OFFLINE
========================================================= */

const tombolOnline =
  document.getElementById(
    "statusToggle"
  );


/*
 * Kita tidak menggunakan listener
 * tambahan untuk status tombol.
 * Fungsi global tetap mengendalikan
 * tampilan dan GPS.
 */


/* =========================================================
   INTERCEPT STATUS ONLINE
========================================================= */

const fungsiOnlineLama =
  window.ubahStatusOnline;


/*
 * Ganti fungsi global dengan versi
 * yang juga menulis presence Firebase.
 */

window.ubahStatusOnline =
  async function() {

    fungsiOnlineLama();


    if (
      pengemudiAktif
    ) {

      await tulisStatusOnline(
        window.online === true
      );


      if (
        window.online !== true
      ) {

        const lokasiRef =
          ref(
            db,
            "driverLocations/" +
            pengemudiAktif.uid
          );


        try {

          await remove(
            lokasiRef
          );

        }

        catch (error) {

          console.error(
            "NEXX REMOVE DRIVER LOCATION ERROR:",
            error
          );

        }

      }

    }

  };


</script>
