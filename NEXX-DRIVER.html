<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXX DRIVER</title>
<meta name="theme-color" content="#111827">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #080b14;
  color: #ffffff;
}

body { overflow-x: hidden; }

.app {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  background:
    radial-gradient(circle at top right, rgba(123,47,247,0.18), transparent 35%),
    #080b14;
}

/* HEADER */
.header {
  padding: 20px 18px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brand { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 42px; height: 42px; border-radius: 14px;
  display: flex; justify-content: center; align-items: center;
  background: linear-gradient(135deg, #7B2FF7, #FF8A00);
  font-size: 21px; font-weight: 900;
  box-shadow: 0 8px 25px rgba(123,47,247,0.35);
}
.brand-text h1 { margin: 0; font-size: 18px; }
.brand-text p { margin: 3px 0 0; color: #9ca3af; font-size: 11px; }

/* STATUS CARD */
.status-card {
  margin: 8px 16px 14px;
  padding: 15px;
  border-radius: 20px;
  background: rgba(17,24,39,0.92);
  border: 1px solid rgba(255,255,255,0.07);
  display: flex; align-items: center; justify-content: space-between;
}
.status-info { display: flex; align-items: center; gap: 11px; }
.status-dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: #ef4444;
  box-shadow: 0 0 10px rgba(239,68,68,0.4);
}
.status-dot.active { background: #22c55e; box-shadow: 0 0 12px rgba(34,197,94,0.7); }
.status-title { margin: 0; font-size: 14px; font-weight: 800; }
.status-title.online { color: #22c55e; }
.status-title.offline { color: #ef4444; }
.status-desc { margin: 3px 0 0; color: #9ca3af; font-size: 11px; }
.status-toggle {
  width: 56px; height: 30px; border: 0; border-radius: 20px;
  padding: 3px; background: #374151; cursor: pointer; transition: 0.25s;
}
.status-toggle span {
  display: block; width: 24px; height: 24px; border-radius: 50%;
  background: #ffffff; transition: 0.25s;
}
.status-toggle.active { background: #22c55e; }
.status-toggle.active span { transform: translateX(26px); }

/* GPS CARD */
.gps-card {
  margin: 0 16px 14px;
  padding: 13px 15px;
  border-radius: 16px;
  background: #111827;
  border: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: center; gap: 10px;
}
.gps-dot { width: 9px; height: 9px; border-radius: 50%; background: #6b7280; }
.gps-dot.active { background: #22c55e; box-shadow: 0 0 10px rgba(34,197,94,0.8); }
.gps-text { font-size: 12px; color: #d1d5db; }

/* MAP */
.map-container {
  margin: 0 16px 16px;
  height: 280px;
  border-radius: 22px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 15px 35px rgba(0,0,0,0.35);
  position: relative;
}
#map { width: 100%; height: 100%; }

.map-status {
  position: absolute;
  z-index: 500;
  margin: 10px;
  padding: 7px 10px;
  border-radius: 10px;
  background: rgba(8,11,20,0.85);
  color: #ffffff;
  font-size: 10px; font-weight: 800;
}

/* ORDER CARD */
.order-card {
  margin: 0 16px 18px;
  padding: 18px;
  border-radius: 22px;
  background: linear-gradient(145deg, rgba(22,25,42,0.98), rgba(13,16,28,0.98));
  border: 1px solid rgba(123,47,247,0.25);
  box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}
.order-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 17px;
}
.order-title { font-size: 16px; font-weight: 800; }
.order-badge {
  padding: 6px 9px; border-radius: 10px;
  background: rgba(255,138,0,0.15); color: #FF8A00;
  font-size: 10px; font-weight: 800;
}
.location-row { display: flex; gap: 11px; margin-bottom: 15px; }
.location-icon {
  width: 32px; height: 32px; min-width: 32px;
  display: flex; justify-content: center; align-items: center;
  border-radius: 11px;
  background: rgba(123,47,247,0.16); color: #a970ff;
  font-size: 15px;
}
.location-info { min-width: 0; }
.location-label { color: #9ca3af; font-size: 10px; margin-bottom: 4px; }
.location-value { font-size: 13px; line-height: 1.4; word-break: break-word; }

.passenger {
  padding: 14px 0; margin-top: 5px;
  border-top: 1px solid rgba(255,255,255,0.06);
}
.passenger-name { font-size: 14px; font-weight: 800; }
.passenger-rating { margin-top: 4px; color: #fbbf24; font-size: 12px; }
.order-state { margin-top: 10px; color: #9ca3af; font-size: 11px; }

/* BUTTON */
.action-button {
  width: 100%; border: 0; border-radius: 15px;
  padding: 14px;
  color: #ffffff; font-size: 14px; font-weight: 800;
  cursor: pointer; transition: 0.2s;
}
.action-button:active { transform: scale(0.98); }
.action-button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.button-orange { background: linear-gradient(135deg, #FF8A00, #ff6500); box-shadow: 0 8px 20px rgba(255,138,0,0.22); }
.button-violet { background: linear-gradient(135deg, #7B2FF7, #6120d8); box-shadow: 0 8px 20px rgba(123,47,247,0.25); }
.button-green { background: linear-gradient(135deg, #22c55e, #16a34a); }
.button-red { background: linear-gradient(135deg, #ef4444, #dc2626); }
.button-gray { background: #374151; }
.button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }

/* EMPTY ORDER */
.empty-order { text-align: center; padding: 25px 10px; color: #9ca3af; }
.empty-icon { font-size: 35px; margin-bottom: 10px; }
.empty-title { color: #ffffff; font-weight: 800; font-size: 14px; }
.empty-text { margin-top: 6px; font-size: 11px; line-height: 1.5; }

/* TOAST */
.toast {
  position: fixed;
  left: 50%; bottom: 25px;
  transform: translateX(-50%) translateY(20px);
  width: calc(100% - 40px); max-width: 460px;
  padding: 13px 15px;
  border-radius: 14px;
  background: rgba(17,24,39,0.96);
  border: 1px solid rgba(255,255,255,0.08);
  color: #ffffff; text-align: center; font-size: 12px;
  opacity: 0; pointer-events: none; transition: 0.25s;
  z-index: 9999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (min-width: 700px) {
  .app { max-width: 700px; }
  .map-container { height: 340px; }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="brand">
      <div class="logo">N</div>
      <div class="brand-text">
        <h1>NEXX DRIVER</h1>
        <p>Driver Simulation System</p>
      </div>
    </div>
  </header>

  <section class="status-card">
    <div class="status-info">
      <div id="statusDot" class="status-dot"></div>
      <div>
        <h2 id="statusTitle" class="status-title offline">OFFLINE</h2>
        <p id="statusDesc" class="status-desc">Anda sedang tidak menerima pesanan</p>
      </div>
    </div>
    <button id="statusToggle" class="status-toggle" type="button" onclick="ubahStatusOnline()">
      <span></span>
    </button>
  </section>

  <section class="gps-card">
    <div id="gpsDot" class="gps-dot"></div>
    <div id="gpsText" class="gps-text">GPS belum aktif</div>
  </section>

  <section class="map-container">
    <div id="mapStatus" class="map-status">GPS MENUNGGU</div>
    <div id="map"></div>
  </section>

  <section class="order-card">
    <div class="order-header">
      <div class="order-title">Pesanan</div>
      <div id="orderBadge" class="order-badge">MENUNGGU</div>
    </div>

    <div id="emptyOrder" class="empty-order">
      <div class="empty-icon">🚗</div>
      <div class="empty-title">Belum ada pesanan</div>
      <div class="empty-text">Aktifkan mode ONLINE untuk menerima pesanan penumpang.</div>
    </div>

    <div id="orderContent" style="display:none;">

      <div class="location-row">
        <div class="location-icon">A</div>
        <div class="location-info">
          <div class="location-label">JEMPUT</div>
          <div id="pickupAddress" class="location-value">-</div>
        </div>
      </div>

      <div class="location-row">
        <div class="location-icon">B</div>
        <div class="location-info">
          <div class="location-label">TUJUAN</div>
          <div id="destinationAddress" class="location-value">-</div>
        </div>
      </div>

      <div class="passenger">
        <div class="passenger-name">Penumpang NEXX</div>
        <div class="passenger-rating">★ 4.9</div>
        <div id="orderState" class="order-state">Penumpang sedang mencari pengemudi.</div>
      </div>

      <button id="acceptButton" class="action-button button-orange" type="button" onclick="terimaPesanan()">
        TERIMA PESANAN
      </button>

      <div id="rejectStartRow" class="button-row">
        <button id="rejectButton" class="action-button button-gray" type="button" onclick="tolakPesanan()">
          TOLAK
        </button>
        <button id="startButton" class="action-button button-violet" type="button" onclick="mulaiPerjalanan()" style="display:none;">
          MULAI PERJALANAN
        </button>
      </div>

      <button id="completeButton" class="action-button button-green" type="button" onclick="selesaikanPerjalanan()" style="display:none;margin-top:12px;">
        SELESAIKAN PERJALANAN
      </button>

    </div>
  </section>

</div>

<div id="toast" class="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- =========================================================
     SCRIPT 1: UI, MAP, GPS, RUTE (NEON GLOW & REDUP)
========================================================= -->
<script>
let online = false;
window.online = false;
let markerSaya = null;
let markerJemput = null;
let markerTujuan = null;

// Variabel untuk rute
let garisRuteGlow = null;
let garisRuteInti = null;
let ruteDilewati = null;
let ruteAsliKoordinat = []; 

let gpsWatchId = null;
let toastTimer = null;

window.pesananAktifId = null;
window.pesananAktif = null;

const POSISI_AWAL = [-7.242, 108.998];
const map = L.map("map");
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap"
}).addTo(map);
map.setView(POSISI_AWAL, 15);

const iconSaya = L.divIcon({
  className: "",
  html: `<div style="width:42px;height:42px;border-radius:50%;background:#7B2FF7;border:4px solid #ffffff;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow: 0 0 20px 8px rgba(123,47,247,0.6), 0 4px 15px rgba(0,0,0,.35);" aria-hidden="true">🚗</div>`,
  iconSize: [42, 42], iconAnchor: [21, 21]
});

function perbaruiMarkerSaya(lat, lon) {
  if (!markerSaya) { markerSaya = L.marker([lat, lon], { icon: iconSaya }).addTo(map); }
  else { markerSaya.setLatLng([lat, lon]); }
}

window.tampilkanMarkerJemput = function(lat, lng) {
  if (markerJemput) map.removeLayer(markerJemput);
  if (typeof lat !== "number" || typeof lng !== "number") return;
  markerJemput = L.marker([lat, lng]).addTo(map).bindPopup("Titik Jemput");
}

window.tampilkanMarkerTujuan = function(lat, lng) {
  if (markerTujuan) map.removeLayer(markerTujuan);
  if (typeof lat !== "number" || typeof lng !== "number") return;
  markerTujuan = L.marker([lat, lng]).addTo(map).bindPopup("Tujuan");
}

// =========================================================
// FUNGSI RUTE: EFEK GLOW & REDUP
// =========================================================

async function ambilRuteOSRM(start, end) {
  if (!start || !end) return;
  const url = `https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`;
  
  try {
    const response = await fetch(url);
    if (!response.ok) return;
    const data = await response.json();
    if (!data.routes || !data.routes.length) return;

    // Simpan koordinat rute asli
    ruteAsliKoordinat = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
    
    // Gambar rute
    gambarRuteTerpisah(start);
    
  } catch (e) {
    console.error("Gagal mengambil rute:", e);
  }
}

function gambarRuteTerpisah(posisiSekarang) {
  if (!ruteAsliKoordinat || ruteAsliKoordinat.length === 0) return;

  // 1. Cari titik koordinat rute yang paling dekat dengan mobil
  let indexTerdekat = 0;
  let jarakTerdekat = Infinity;

  ruteAsliKoordinat.forEach((koordinat, index) => {
    const dx = koordinat[0] - posisiSekarang[0];
    const dy = koordinat[1] - posisiSekarang[1];
    const jarak = (dx * dx) + (dy * dy);
    
    if (jarak < jarakTerdekat) {
      jarakTerdekat = jarak;
      indexTerdekat = index;
    }
  });

  // 2. Potong garis menjadi dua (sudah dilewati vs belum)
  const ruteSudahDilewati = ruteAsliKoordinat.slice(0, indexTerdekat + 1);
  const ruteBelumDilewati = ruteAsliKoordinat.slice(indexTerdekat);

  // 3. Bersihkan garis lama
  if (ruteDilewati) map.removeLayer(ruteDilewati);
  if (garisRuteGlow) map.removeLayer(garisRuteGlow);
  if (garisRuteInti) map.removeLayer(garisRuteInti);

  // 4. Gambar Rute SUDAH Dilewati (Abu-abu Redup)
  if (ruteSudahDilewati.length > 1) {
    ruteDilewati = L.polyline(ruteSudahDilewati, {
      color: "#6b7280", // Abu-abu
      weight: 6,
      opacity: 0.6,
      lineCap: "round",
      lineJoin: "round"
    }).addTo(map);
  }

  // 5. Gambar Rute BELUM Dilewati (Neon Glow)
  if (ruteBelumDilewati.length > 1) {
    // Lapisan Glow
    garisRuteGlow = L.polyline(ruteBelumDilewati, {
      color: "#a855f7", weight: 20, opacity: 0.4, lineCap: "round", lineJoin: "round"
    }).addTo(map);

    // Lapisan Inti
    garisRuteInti = L.polyline(ruteBelumDilewati, {
      color: "#7B2FF7", weight: 6, opacity: 1, lineCap: "round", lineJoin: "round"
    }).addTo(map);
  }
}

function hapusMarkerPesanan() {
  if (markerJemput) { map.removeLayer(markerJemput); markerJemput = null; }
  if (markerTujuan) { map.removeLayer(markerTujuan); markerTujuan = null; }
  if (ruteDilewati) { map.removeLayer(ruteDilewati); ruteDilewati = null; }
  if (garisRuteGlow) { map.removeLayer(garisRuteGlow); garisRuteGlow = null; }
  if (garisRuteInti) { map.removeLayer(garisRuteInti); garisRuteInti = null; }
  ruteAsliKoordinat = [];
}

// =========================================================

function tampilkanPesan(pesan) {
  const toast = document.getElementById("toast");
  toast.textContent = pesan;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2500);
}

window.tampilkanPesanan = function() {
  const empty = document.getElementById("emptyOrder");
  const content = document.getElementById("orderContent");
  if (window.pesananAktifId) { 
    empty.style.display = "none";
    content.style.display = "block"; 
  } else {
    empty.style.display = "block";
    content.style.display = "none";
  }
}

function ubahStatusOnline() {
  online = !online;
  window.online = online;
  document.getElementById("statusToggle").classList.toggle("active", online);
  document.getElementById("statusDot").classList.toggle("active", online);

  if (online) {
    document.getElementById("statusTitle").textContent = "ONLINE";
    document.getElementById("statusTitle").className = "status-title online";
    document.getElementById("statusDesc").textContent = "Siap menerima pesanan";
    aktifkanGPS();
    tampilkanPesan("Mode ONLINE aktif.");
  } else {
    document.getElementById("statusTitle").textContent = "OFFLINE";
    document.getElementById("statusTitle").className = "status-title offline";
    document.getElementById("statusDesc").textContent = "Anda sedang tidak menerima pesanan";
    hentikanGPS();
    tampilkanPesan("Mode OFFLINE aktif.");
  }

  if (typeof window.sinkronStatusOnline === "function") {
    window.sinkronStatusOnline(online);
  }
}

function aktifkanGPS() {
  if (!navigator.geolocation || !window.isSecureContext) {
    tampilkanPesan("GPS memerlukan HTTPS atau localhost.");
    return;
  }
  if (gpsWatchId !== null) return;

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      perbaruiMarkerSaya(pos.coords.latitude, pos.coords.longitude);
      map.setView([pos.coords.latitude, pos.coords.longitude], 16);
      document.getElementById("gpsText").textContent = "GPS aktif · Posisi ditemukan";
      document.getElementById("gpsDot").classList.add("active");
    },
    (err) => { document.getElementById("gpsText").textContent = "GPS belum tersedia"; }
  );

  gpsWatchId = navigator.geolocation.watchPosition(
    (pos) => {
      perbaruiMarkerSaya(pos.coords.latitude, pos.coords.longitude);
      document.getElementById("gpsText").textContent = "GPS aktif · Lokasi diperbarui";
      document.getElementById("gpsDot").classList.add("active");
      document.getElementById("mapStatus").textContent = "GPS LIVE";

      // Real-time update garis rute (potong garis redup) saat mobil bergerak
      if (window.pesananAktif && window.pesananAktif.status === "TO_PICKUP" && window.pesananAktif.pickupLat) {
         gambarRuteTerpisah([pos.coords.latitude, pos.coords.longitude]);
      }
    },
    (err) => { document.getElementById("gpsDot").classList.remove("active"); },
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 }
  );
}

function hentikanGPS() {
  if (gpsWatchId !== null) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
  document.getElementById("gpsText").textContent = "GPS tidak aktif";
  document.getElementById("gpsDot").classList.remove("active");
  document.getElementById("mapStatus").textContent = "GPS OFFLINE";
}

window.tampilkanPesananFirebase = function(order) {
  document.getElementById("pickupAddress").textContent = order.pickup || "-";
  document.getElementById("destinationAddress").textContent = order.destination || "-";
  
  if (typeof order.pickupLat === "number" && typeof order.pickupLng === "number") {
    window.tampilkanMarkerJemput(order.pickupLat, order.pickupLng);
  }
  if (typeof order.tujuanLat === "number" && typeof order.tujuanLng === "number") {
    window.tampilkanMarkerTujuan(order.tujuanLat, order.tujuanLng);
  }
  window.tampilkanPesanan();
}

window.updateUIStatusOrder = function(status) {
  const badge = document.getElementById("orderBadge");
  const state = document.getElementById("orderState");
  const accept = document.getElementById("acceptButton");
  const row = document.getElementById("rejectStartRow");
  const reject = document.getElementById("rejectButton");
  const start = document.getElementById("startButton");
  const complete = document.getElementById("completeButton");

  accept.style.display = "none"; row.style.display = "none"; reject.style.display = "none";
  start.style.display = "none"; complete.style.display = "none";

  if (status === "SEARCHING") {
    badge.textContent = "PESANAN BARU";
    state.textContent = "Penumpang sedang mencari pengemudi.";
    accept.style.display = "block"; row.style.display = "grid"; reject.style.display = "block";
  } 
  else if (status === "ACCEPTED") {
    badge.textContent = "DITERIMA";
    state.textContent = "Pesanan diterima. Tekan MULAI untuk menuju titik jemput.";
    row.style.display = "grid";
    start.textContent = "MULAI PERJALANAN";
    start.onclick = () => mulaiPerjalanan();
    start.style.display = "block";
  } 
  else if (status === "TO_PICKUP") {
    badge.textContent = "MENUJU JEMPUT";
    state.textContent = "Anda sedang menuju lokasi penjemputan.";
    row.style.display = "grid";
    start.textContent = "TIBA DI LOKASI";
    start.onclick = () => mulaiPerjalanan();
    start.style.display = "block";

    if (window.pesananAktif && window.pesananAktif.pickupLat) {
        const posisiSekarang = markerSaya ? markerSaya.getLatLng() : {lat: POSISI_AWAL[0], lng: POSISI_AWAL[1]};
        ambilRuteOSRM([posisiSekarang.lat, posisiSekarang.lng], [window.pesananAktif.pickupLat, window.pesananAktif.pickupLng]);
    }
  } 
  else if (status === "IN_TRIP") {
    badge.textContent = "DALAM PERJALANAN";
    state.textContent = "Perjalanan bersama penumpang sedang berlangsung.";
    complete.style.display = "block";
    
    if (window.pesananAktif && window.pesananAktif.tujuanLat) {
        const posisiSekarang = markerSaya ? markerSaya.getLatLng() : {lat: POSISI_AWAL[0], lng: POSISI_AWAL[1]};
        ambilRuteOSRM([posisiSekarang.lat, posisiSekarang.lng], [window.pesananAktif.tujuanLat, window.pesananAktif.tujuanLng]);
    }
  } 
  else if (status === "COMPLETED") {
    badge.textContent = "SELESAI";
    state.textContent = "Perjalanan telah selesai.";
    hapusMarkerPesanan();
  } 
  else if (status === "REJECTED") {
    badge.textContent = "DITOLAK";
    state.textContent = "Pesanan ditolak.";
  }
}

window.resetTampilanPesanan = function() {
  document.getElementById("pickupAddress").textContent = "-";
  document.getElementById("destinationAddress").textContent = "-";
  document.getElementById("orderBadge").textContent = "MENUNGGU";
  document.getElementById("orderState").textContent = "Belum ada pesanan aktif.";
  hapusMarkerPesanan(); 
  window.tampilkanPesanan();
}

async function terimaPesanan() {
  if (!online) { tampilkanPesan("Anda sedang OFFLINE."); return; }
  if (typeof window.terimaPesananFirebase !== "function") return;
  document.getElementById("acceptButton").disabled = true;
  await window.terimaPesananFirebase();
  document.getElementById("acceptButton").disabled = false;
}
