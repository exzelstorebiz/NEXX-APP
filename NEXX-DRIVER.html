<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXX DRIVER</title>
<meta name="theme-color" content="#111827">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #080b14;
  color: #ffffff;
}

body { overflow-x: hidden; }

.app {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  background:
    radial-gradient(circle at top right, rgba(123,47,247,0.18), transparent 35%),
    #080b14;
}

/* HEADER */
.header {
  padding: 20px 18px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brand { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 42px; height: 42px; border-radius: 14px;
  display: flex; justify-content: center; align-items: center;
  background: linear-gradient(135deg, #7B2FF7, #FF8A00);
  font-size: 21px; font-weight: 900;
  box-shadow: 0 8px 25px rgba(123,47,247,0.35);
}
.brand-text h1 { margin: 0; font-size: 18px; }
.brand-text p { margin: 3px 0 0; color: #9ca3af; font-size: 11px; }

/* STATUS CARD */
.status-card {
  margin: 8px 16px 14px;
  padding: 15px;
  border-radius: 20px;
  background: rgba(17,24,39,0.92);
  border: 1px solid rgba(255,255,255,0.07);
  display: flex; align-items: center; justify-content: space-between;
}
.status-info { display: flex; align-items: center; gap: 11px; }
.status-dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: #ef4444;
  box-shadow: 0 0 10px rgba(239,68,68,0.4);
}
.status-dot.active { background: #22c55e; box-shadow: 0 0 12px rgba(34,197,94,0.7); }
.status-title { margin: 0; font-size: 14px; font-weight: 800; }
.status-title.online { color: #22c55e; }
.status-title.offline { color: #ef4444; }
.status-desc { margin: 3px 0 0; color: #9ca3af; font-size: 11px; }
.status-toggle {
  width: 56px; height: 30px; border: 0; border-radius: 20px;
  padding: 3px; background: #374151; cursor: pointer; transition: 0.25s;
}
.status-toggle span {
  display: block; width: 24px; height: 24px; border-radius: 50%;
  background: #ffffff; transition: 0.25s;
}
.status-toggle.active { background: #22c55e; }
.status-toggle.active span { transform: translateX(26px); }

/* GPS CARD */
.gps-card {
  margin: 0 16px 14px;
  padding: 13px 15px;
  border-radius: 16px;
  background: #111827;
  border: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: center; gap: 10px;
}
.gps-dot { width: 9px; height: 9px; border-radius: 50%; background: #6b7280; }
.gps-dot.active { background: #22c55e; box-shadow: 0 0 10px rgba(34,197,94,0.8); }
.gps-text { font-size: 12px; color: #d1d5db; }

/* MAP */
.map-container {
  margin: 0 16px 16px;
  height: 280px;
  border-radius: 22px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 15px 35px rgba(0,0,0,0.35);
  position: relative;
}
#map { width: 100%; height: 100%; }

.map-status {
  position: absolute;
  z-index: 500;
  margin: 10px;
  padding: 7px 10px;
  border-radius: 10px;
  background: rgba(8,11,20,0.85);
  color: #ffffff;
  font-size: 10px; font-weight: 800;
}

/* ORDER CARD */
.order-card {
  margin: 0 16px 18px;
  padding: 18px;
  border-radius: 22px;
  background: linear-gradient(145deg, rgba(22,25,42,0.98), rgba(13,16,28,0.98));
  border: 1px solid rgba(123,47,247,0.25);
  box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}
.order-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 17px;
}
.order-title { font-size: 16px; font-weight: 800; }
.order-badge {
  padding: 6px 9px; border-radius: 10px;
  background: rgba(255,138,0,0.15); color: #FF8A00;
  font-size: 10px; font-weight: 800;
}
.location-row { display: flex; gap: 11px; margin-bottom: 15px; }
.location-icon {
  width: 32px; height: 32px; min-width: 32px;
  display: flex; justify-content: center; align-items: center;
  border-radius: 11px;
  background: rgba(123,47,247,0.16); color: #a970ff;
  font-size: 15px;
}
.location-info { min-width: 0; }
.location-label { color: #9ca3af; font-size: 10px; margin-bottom: 4px; }
.location-value { font-size: 13px; line-height: 1.4; word-break: break-word; }

.passenger {
  padding: 14px 0; margin-top: 5px;
  border-top: 1px solid rgba(255,255,255,0.06);
}
.passenger-name { font-size: 14px; font-weight: 800; }
.passenger-rating { margin-top: 4px; color: #fbbf24; font-size: 12px; }
.order-state { margin-top: 10px; color: #9ca3af; font-size: 11px; }

/* BUTTON */
.action-button {
  width: 100%; border: 0; border-radius: 15px;
  padding: 14px;
  color: #ffffff; font-size: 14px; font-weight: 800;
  cursor: pointer; transition: 0.2s;
}
.action-button:active { transform: scale(0.98); }
.action-button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.button-orange { background: linear-gradient(135deg, #FF8A00, #ff6500); box-shadow: 0 8px 20px rgba(255,138,0,0.22); }
.button-violet { background: linear-gradient(135deg, #7B2FF7, #6120d8); box-shadow: 0 8px 20px rgba(123,47,247,0.25); }
.button-green { background: linear-gradient(135deg, #22c55e, #16a34a); }
.button-red { background: linear-gradient(135deg, #ef4444, #dc2626); }
.button-gray { background: #374151; }
.button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }

/* EMPTY ORDER */
.empty-order { text-align: center; padding: 25px 10px; color: #9ca3af; }
.empty-icon { font-size: 35px; margin-bottom: 10px; }
.empty-title { color: #ffffff; font-weight: 800; font-size: 14px; }
.empty-text { margin-top: 6px; font-size: 11px; line-height: 1.5; }

/* TOAST */
.toast {
  position: fixed;
  left: 50%; bottom: 25px;
  transform: translateX(-50%) translateY(20px);
  width: calc(100% - 40px); max-width: 460px;
  padding: 13px 15px;
  border-radius: 14px;
  background: rgba(17,24,39,0.96);
  border: 1px solid rgba(255,255,255,0.08);
  color: #ffffff; text-align: center; font-size: 12px;
  opacity: 0; pointer-events: none; transition: 0.25s;
  z-index: 9999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (min-width: 700px) {
  .app { max-width: 700px; }
  .map-container { height: 340px; }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="brand">
      <div class="logo">N</div>
      <div class="brand-text">
        <h1>NEXX DRIVER</h1>
        <p>Driver Simulation System</p>
      </div>
    </div>
  </header>

  <section class="status-card">
    <div class="status-info">
      <div id="statusDot" class="status-dot"></div>
      <div>
        <h2 id="statusTitle" class="status-title offline">OFFLINE</h2>
        <p id="statusDesc" class="status-desc">Anda sedang tidak menerima pesanan</p>
      </div>
    </div>
    <button id="statusToggle" class="status-toggle" type="button" onclick="ubahStatusOnline()">
      <span></span>
    </button>
  </section>

  <section class="gps-card">
    <div id="gpsDot" class="gps-dot"></div>
    <div id="gpsText" class="gps-text">GPS belum aktif</div>
  </section>

  <section class="map-container">
    <div id="mapStatus" class="map-status">GPS MENUNGGU</div>
    <div id="map"></div>
  </section>

  <section class="order-card">
    <div class="order-header">
      <div class="order-title">Pesanan</div>
      <div id="orderBadge" class="order-badge">MENUNGGU</div>
    </div>

    <div id="emptyOrder" class="empty-order">
      <div class="empty-icon">🚗</div>
      <div class="empty-title">Belum ada pesanan</div>
      <div class="empty-text">Aktifkan mode ONLINE untuk menerima pesanan penumpang.</div>
    </div>

    <div id="orderContent" style="display:none;">

      <div class="location-row">
        <div class="location-icon">A</div>
        <div class="location-info">
          <div class="location-label">JEMPUT</div>
          <div id="pickupAddress" class="location-value">-</div>
        </div>
      </div>

      <div class="location-row">
        <div class="location-icon">B</div>
        <div class="location-info">
          <div class="location-label">TUJUAN</div>
          <div id="destinationAddress" class="location-value">-</div>
        </div>
      </div>

      <div class="passenger">
        <div class="passenger-name">Penumpang NEXX</div>
        <div class="passenger-rating">★ 4.9</div>
        <div id="orderState" class="order-state">Penumpang sedang mencari pengemudi.</div>
      </div>

      <button id="acceptButton" class="action-button button-orange" type="button" onclick="terimaPesanan()">
        TERIMA PESANAN
      </button>

      <div id="rejectStartRow" class="button-row">
        <button id="rejectButton" class="action-button button-gray" type="button" onclick="tolakPesanan()">
          TOLAK
        </button>
        <button id="startButton" class="action-button button-violet" type="button" onclick="mulaiPerjalanan()" style="display:none;">
          MULAI PERJALANAN
        </button>
      </div>

      <button id="completeButton" class="action-button button-green" type="button" onclick="selesaikanPerjalanan()" style="display:none;margin-top:12px;">
        SELESAIKAN PERJALANAN
      </button>

    </div>
  </section>

</div>

<div id="toast" class="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- =========================================================
     SCRIPT 1: NON-MODULE (UI, MAP, GPS, TOMBOL)
========================================================= -->

<script>

/* =========================================================
   STATE GLOBAL
========================================================= */

let online = false;
window.online = false;

let posisiSaya = null;
let markerSaya = null;
let markerJemput = null;
let markerTujuan = null;
let garisRute = null;
let gpsWatchId = null;
let gpsAktif = false;
let petaSiap = false;
let toastTimer = null;

/* State pesanan (dibagikan ke module via window) */
window.pesananAktifId = null;
window.pesananAktif = null;

/* Titik default (jika GPS belum aktif) */
const POSISI_AWAL = [-7.242, 108.998];

/* =========================================================
   MAP INIT
========================================================= */

const map = L.map("map");
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

map.setView(POSISI_AWAL, 15);
petaSiap = true;

/* Icon driver */
const iconSaya = L.divIcon({
  className: "",
  html: `<div style="width:42px;height:42px;border-radius:50%;background:#7B2FF7;border:4px solid #ffffff;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 15px rgba(0,0,0,.35);" aria-hidden="true">🚗</div>`,
  iconSize: [42, 42],
  iconAnchor: [21, 21]
});

/* =========================================================
   MARKER DRIVER
========================================================= */

function perbaruiMarkerSaya(lat, lon) {
  posisiSaya = [lat, lon];
  if (!markerSaya) {
    markerSaya = L.marker([lat, lon], { icon: iconSaya }).addTo(map);
  } else {
    markerSaya.setLatLng([lat, lon]);
  }
}

/* =========================================================
   MARKER JEMPUT & TUJUAN (pakai koordinat order)
========================================================= */

function tampilkanMarkerJemput(lat, lng) {
  if (markerJemput) map.removeLayer(markerJemput);
  if (typeof lat !== "number" || typeof lng !== "number") return;
  markerJemput = L.marker([lat, lng]).addTo(map).bindPopup("Titik Jemput");
}

function tampilkanMarkerTujuan(lat, lng) {
  if (markerTujuan) map.removeLayer(markerTujuan);
  if (typeof lat !== "number" || typeof lng !== "number") return;
  markerTujuan = L.marker([lat, lng]).addTo(map).bindPopup("Tujuan");
}

function hapusMarkerPesanan() {
  if (markerJemput) { map.removeLayer(markerJemput); markerJemput = null; }
  if (markerTujuan) { map.removeLayer(markerTujuan); markerTujuan = null; }
  if (garisRute) { map.removeLayer(garisRute); garisRute = null; }
}

/* =========================================================
   TOAST
========================================================= */

function tampilkanPesan(pesan) {
  const toast = document.getElementById("toast");
  toast.textContent = pesan;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2500);
}

/* =========================================================
   TAMPILKAN / SEMBUNYIKAN ORDER CARD
========================================================= */

function tampilkanPesanan() {
  const empty = document.getElementById("emptyOrder");
  const content = document.getElementById("orderContent");
  if (window.pesananAktif && window.pesananAktifId) {
    empty.style.display = "none";
    content.style.display = "block";
  } else {
    empty.style.display = "block";
    content.style.display = "none";
  }
}

/* =========================================================
   STATUS ONLINE / OFFLINE
========================================================= */

function ubahStatusOnline() {
  online = !online;
  window.online = online;

  const tombol = document.getElementById("statusToggle");
  const judul = document.getElementById("statusTitle");
  const deskripsi = document.getElementById("statusDesc");
  const dot = document.getElementById("statusDot");

  tombol.classList.toggle("active", online);
  dot.classList.toggle("active", online);

  if (online) {
    judul.textContent = "ONLINE";
    judul.className = "status-title online";
    deskripsi.textContent = "Siap menerima pesanan";
    aktifkanGPS();
    tampilkanPesan("Mode ONLINE aktif.");
  } else {
    judul.textContent = "OFFLINE";
    judul.className = "status-title offline";
    deskripsi.textContent = "Anda sedang tidak menerima pesanan";
    hentikanGPS();
    tampilkanPesan("Mode OFFLINE aktif.");
  }

  // Sinkronkan presence ke Firebase (via module bridge)
  if (typeof window.sinkronStatusOnline === "function") {
    window.sinkronStatusOnline(online);
  }
}

/* =========================================================
   GPS
========================================================= */

function aktifkanGPS() {
  if (!navigator.geolocation) {
    tampilkanPesan("Browser ini tidak mendukung GPS.");
    return;
  }
  if (!window.isSecureContext) {
    tampilkanPesan("GPS memerlukan HTTPS atau localhost.");
    return;
  }
  if (gpsWatchId !== null) return;

  document.getElementById("gpsText").textContent = "Meminta lokasi GPS...";

  navigator.geolocation.getCurrentPosition(
    (position) => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      gpsAktif = true;
      perbaruiMarkerSaya(lat, lon);
      map.setView([lat, lon], 16);
      document.getElementById("gpsText").textContent = "GPS aktif · Posisi ditemukan";
      document.getElementById("gpsDot").classList.add("active");
      document.getElementById("mapStatus").textContent = "GPS AKTIF";
      tampilkanPesan("Lokasi GPS berhasil ditemukan.");
    },
    (error) => {
      let pesan = "Lokasi GPS belum berhasil diperoleh.";
      if (error.code === 1) pesan = "Izin lokasi ditolak. Izinkan akses lokasi browser.";
      else if (error.code === 2) pesan = "Posisi belum tersedia. Periksa GPS dan sinyal.";
      else if (error.code === 3) pesan = "GPS terlalu lama merespons. Coba lagi.";
      document.getElementById("gpsText").textContent = "GPS belum tersedia";
      tampilkanPesan(pesan);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );

  gpsWatchId = navigator.geolocation.watchPosition(
    (position) => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      gpsAktif = true;
      perbaruiMarkerSaya(lat, lon);
      document.getElementById("gpsText").textContent = "GPS aktif · Lokasi diperbarui";
      document.getElementById("gpsDot").classList.add("active");
      document.getElementById("mapStatus").textContent = "GPS LIVE";
    },
    (error) => {
      if (error.code === 1) {
        document.getElementById("gpsText").textContent = "Izin GPS perlu diperiksa";
      } else {
        document.getElementById("gpsText").textContent = "Menunggu sinyal GPS";
      }
      document.getElementById("gpsDot").classList.remove("active");
    },
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 }
  );
}

function hentikanGPS() {
  if (gpsWatchId !== null) {
    navigator.geolocation.clearWatch(gpsWatchId);
    gpsWatchId = null;
  }
  gpsAktif = false;
  document.getElementById("gpsText").textContent = "GPS tidak aktif";
  document.getElementById("gpsDot").classList.remove("active");
  document.getElementById("mapStatus").textContent = "GPS OFFLINE";
}

/* =========================================================
   TAMPILKAN PESANAN (dari data order Firebase)
========================================================= */

function tampilkanPesananFirebase(order) {
  document.getElementById("pickupAddress").textContent = order.pickup || "-";
  document.getElementById("destinationAddress").textContent = order.destination || "-";
  document.getElementById("orderBadge").textContent = "PESANAN BARU";
  document.getElementById("orderState").textContent = "Penumpang sedang mencari pengemudi.";

  // Marker pakai koordinat asli order
  if (typeof order.pickupLat === "number" && typeof order.pickupLng === "number") {
    tampilkanMarkerJemput(order.pickupLat, order.pickupLng);
  }
  if (typeof order.tujuanLat === "number" && typeof order.tujuanLng === "number") {
    tampilkanMarkerTujuan(order.tujuanLat, order.tujuanLng);
  }

  tampilkanPesanan();
}

/* =========================================================
   UPDATE UI BERDASARKAN STATUS
========================================================= */

function updateUIStatusOrder(status, order) {
  const badge = document.getElementById("orderBadge");
  const state = document.getElementById("orderState");
  const accept = document.getElementById("acceptButton");
  const row = document.getElementById("rejectStartRow");
  const reject = document.getElementById("rejectButton");
  const start = document.getElementById("startButton");
  const complete = document.getElementById("completeButton");

  // Reset semua tombol
  accept.style.display = "none";
  row.style.display = "none";
  reject.style.display = "none";
  start.style.display = "none";
  complete.style.display = "none";

  if (status === "SEARCHING") {
    badge.textContent = "PESANAN BARU";
    state.textContent = "Penumpang sedang mencari pengemudi.";
    accept.style.display = "block";
    row.style.display = "grid";
    reject.style.display = "block";
  }
  else if (status === "ACCEPTED") {
    badge.textContent = "DITERIMA";
    state.textContent = "Pesanan diterima. Tekan MULAI untuk menuju titik jemput.";
    row.style.display = "grid";
    start.style.display = "block";
  }
  else if (status === "TO_PICKUP") {
    badge.textContent = "MENUJU JEMPUT";
    state.textContent = "Anda sedang menuju lokasi penjemputan.";
    // Tidak ada tombol — otomatis lanjut saat tiba
    // Untuk simulasi, kita tampilkan tombol "TIBA DI LOKASI"
    row.style.display = "grid";
    start.textContent = "TIBA DI LOKASI";
    start.style.display = "block";
    start.onclick = function () {
      if (typeof window.tibaDiLokasiFirebase === "function") {
        window.tibaDiLokasiFirebase();
      }
    };
  }
  else if (status === "IN_TRIP") {
    badge.textContent = "DALAM PERJALANAN";
    state.textContent = "Perjalanan bersama penumpang sedang berlangsung.";
    complete.style.display = "block";
    // Reset start button
    start.textContent = "MULAI PERJALANAN";
    start.onclick = function () { mulaiPerjalanan(); };
  }
  else if (status === "COMPLETED") {
    badge.textContent = "SELESAI";
    state.textContent = "Perjalanan telah selesai.";
  }
  else if (status === "REJECTED") {
    badge.textContent = "DITOLAK";
    state.textContent = "Pesanan ditolak.";
  }
}

/* =========================================================
   RESET TAMPILAN
========================================================= */

function resetTampilanPesanan() {
  document.getElementById("pickupAddress").textContent = "-";
  document.getElementById("destinationAddress").textContent = "-";
  document.getElementById("orderBadge").textContent = "MENUNGGU";
  document.getElementById("orderState").textContent = "Belum ada pesanan aktif.";

  const start = document.getElementById("startButton");
  start.textContent = "MULAI PERJALANAN";
  start.onclick = function () { mulaiPerjalanan(); };

  hapusMarkerPesanan();
  tampilkanPesanan();
}

/* =========================================================
   FUNGSI TOMBOL (dipanggil dari HTML)
========================================================= */

async function terimaPesanan() {
  if (!online) {
    tampilkanPesan("Anda sedang OFFLINE. Aktifkan ONLINE terlebih dahulu.");
    return;
  }
  if (!window.pesananAktifId || !window.pesananAktif) {
    tampilkanPesan("Belum ada pesanan.");
    return;
  }
  if (typeof window.terimaPesananFirebase !== "function") {
    tampilkanPesan("Modul Firebase belum siap.");
    return;
  }

  const btn = document.getElementById("acceptButton");
  btn.disabled = true;
  btn.textContent = "MEMPROSES...";

  try {
    await window.terimaPesananFirebase();
  } finally {
    btn.disabled = false;
    btn.textContent = "TERIMA PESANAN";
  }
}

async function tolakPesanan() {
  if (!online) { tampilkanPesan("Anda sedang OFFLINE."); return; }
  if (!window.pesananAktifId || !window.pesananAktif) { tampilkanPesan("Belum ada pesanan."); return; }
  if (typeof window.tolakPesananFirebase !== "function") { tampilkanPesan("Modul Firebase belum siap."); return; }

  const btn = document.getElementById("rejectButton");
  btn.disabled = true;
  btn.textContent = "MEMPROSES...";

  try {
    await window.tolakPesananFirebase();
  } finally {
    btn.disabled = false;
    btn.textContent = "TOLAK";
  }
}

async function mulaiPerjalanan() {
  if (!window.pesananAktifId || !window.pesananAktif) { tampilkanPesan("Tidak ada pesanan aktif."); return; }

  const status = window.pesananAktif.status;

  if (status === "ACCEPTED") {
    if (typeof window.mulaiPerjalananFirebase !== "function") { tampilkanPesan("Modul Firebase belum siap."); return; }
    const btn = document.getElementById("startButton");
    btn.disabled = true; btn.textContent = "MEMPROSES...";
    try {
      await window.mulaiPerjalananFirebase(); // ACCEPTED -> TO_PICKUP
    } finally {
      btn.disabled = false;
    }
    return;
  }

  if (status === "TO_PICKUP") {
    if (typeof window.tibaDiLokasiFirebase !== "function") { tampilkanPesan("Modul Firebase belum siap."); return; }
    const btn = document.getElementById("startButton");
    btn.disabled = true; btn.textContent = "MEMPROSES...";
    try {
      await window.tibaDiLokasiFirebase(); // TO_PICKUP -> IN_TRIP
    } finally {
      btn.disabled = false;
    }
    return;
  }

  tampilkanPesan("Pesanan belum siap dimulai.");
}

async function selesaikanPerjalanan() {
  if (!window.pesananAktifId || !window.pesananAktif) { tampilkanPesan("Tidak ada perjalanan aktif."); return; }
  if (window.pesananAktif.status !== "IN_TRIP") { tampilkanPesan("Perjalanan belum aktif."); return; }
  if (typeof window.selesaikanPerjalananFirebase !== "function") { tampilkanPesan("Modul Firebase belum siap."); return; }

  const btn = document.getElementById("completeButton");
  btn.disabled = true; btn.textContent = "MEMPROSES...";

  try {
    await window.selesaikanPerjalananFirebase();
  } finally {
    btn.disabled = false; btn.textContent = "SELESAIKAN PERJALANAN";
  }
}

/* =========================================================
   RESIZE
========================================================= */

setTimeout(() => { map.invalidateSize(); }, 300);
window.addEventListener("resize", () => { map.invalidateSize(); });

</script>

<!-- =========================================================
     SCRIPT 2: FIREBASE MODULE
========================================================= -->

<script type="module">

import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {
  getDatabase, ref, onValue, update, remove, serverTimestamp, onDisconnect
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCVPNfaUs8dmsr6n4oeb9WKGAlfsZ4nVfE",
  authDomain: "nexx-simulasi.firebaseapp.com",
  databaseURL: "https://nexx-simulasi-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "nexx-simulasi",
  storageBucket: "nexx-simulasi.firebasestorage.app",
  messagingSenderId: "741542128730",
  appId: "1:741542128730:web:d12c9246b9810216c0fc63"
};

const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

/* UID (hardcoded untuk simulasi) */
const UID_PENGEMUDI = "p6iENr0Gt1gnSfdSv4FCz4brL803";
const UID_PENUMPANG = "d6nrr1YHgoXRBaCIuMMuQm7YZra2";

let pengemudiAktif = null;
let driverGpsWatchId = null;
let unsubscribeOrders = null;

/* =========================================================
   BRIDGE: SINKRONISASI STATUS ONLINE KE FIREBASE
========================================================= */

window.sinkronStatusOnline = async function (aktif) {
  if (!pengemudiAktif) return;
  const presenceRef = ref(db, "driverPresence/" + pengemudiAktif.uid);
  try {
    await update(presenceRef, {
      uid: pengemudiAktif.uid,
      online: aktif,
      updatedAt: serverTimestamp()
    });
  } catch (e) {
    console.error("Presence error:", e);
  }
};

/* =========================================================
   PANTAU ORDERS (SATU LISTENER)
========================================================= */

function mulaiPantauPesanan() {
  if (unsubscribeOrders) unsubscribeOrders();

  const ordersRef = ref(db, "orders");

  unsubscribeOrders = onValue(
    ordersRef,
    (snapshot) => {
      // Jika driver sudah punya pesanan aktif non-SEARCHING, update datanya saja
      if (window.pesananAktif && window.pesananAktifId && window.pesananAktif.status !== "SEARCHING") {
        const snap = snapshot.child(window.pesananAktifId);
        if (snap.exists()) {
          const orderAktif = snap.val();
          window.pesananAktif = orderAktif;
          updateUIStatusOrder(orderAktif.status, orderAktif);
          tampilkanPesananFirebase(orderAktif);
        }
        return;
      }

      // Cari order SEARCHING pertama
      let ditemukan = false;
      snapshot.forEach((child) => {
        if (ditemukan) return;
        const order = child.val();
        if (!order) return;
        if (order.status === "SEARCHING") {
          ditemukan = true;
          window.pesananAktifId = child.key;
          window.pesananAktif = order;
          tampilkanPesananFirebase(order);
          updateUIStatusOrder("SEARCHING", order);
        }
      });

      // Tidak ada SEARCHING
      if (!ditemukan) {
        if (!window.pesananAktif || window.pesananAktif.status === "SEARCHING") {
          window.pesananAktifId = null;
          window.pesananAktif = null;
          resetTampilanPesanan();
        }
      }
    },
    (error) => {
      console.error("Orders listener error:", error);
      tampilkanPesan("Firebase gagal membaca pesanan.");
    }
  );
}

/* =========================================================
   KIRIM LOKASI DRIVER (field: lng, bukan lon)
========================================================= */

function mulaiKirimLokasiDriver() {
  if (!navigator.geolocation) return;
  if (driverGpsWatchId !== null) return;

  driverGpsWatchId = navigator.geolocation.watchPosition(
    async (position) => {
      if (window.online !== true) return;
      if (!pengemudiAktif) return;

      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      try {
        await update(ref(db, "driverLocations/" + pengemudiAktif.uid), {
          lat: lat,
          lng: lng,          // ← pakai lng (bukan lon)
          updatedAt: serverTimestamp()
        });
      } catch (e) {
        console.error("GPS Firebase error:", e);
      }
    },
    (error) => { console.error("Driver GPS error:", error); },
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 }
  );
}

/* =========================================================
   FUNGSI STATUS ORDER (pakai update, bukan set)
========================================================= */

async function ubahStatusOrder(statusBaru, pesanSukses) {
  if (!pengemudiAktif) { tampilkanPesan("Akun driver belum siap."); return; }
  if (window.online !== true) { tampilkanPesan("Driver sedang OFFLINE."); return; }
  if (!window.pesananAktifId) { tampilkanPesan("Pesanan tidak ditemukan."); return; }

  const orderRef = ref(db, "orders/" + window.pesananAktifId);

  try {
    // UPDATE — pertahankan semua field lain
    await update(orderRef, {
      driverUid: pengemudiAktif.uid,
      status: statusBaru,
      updatedAt: serverTimestamp()
    });

    // Update state lokal
    window.pesananAktif = { ...window.pesananAktif, status: statusBaru, driverUid: pengemudiAktif.uid };
    updateUIStatusOrder(statusBaru, window.pesananAktif);
    tampilkanPesan(pesanSukses || "Status diperbarui.");
  } catch (e) {
    console.error("Ubah status error:", e);
    tampilkanPesan("Gagal mengubah status pesanan.");
  }
}

/* =========================================================
   FUNGSI-FUNGSI BRIDGE
========================================================= */

window.terimaPesananFirebase = async function () {
  if (!window.pesananAktif || window.pesananAktif.status !== "SEARCHING") {
    tampilkanPesan("Pesanan sudah tidak tersedia.");
    return;
  }
  await ubahStatusOrder("ACCEPTED", "Pesanan diterima.");
};

window.tolakPesananFirebase = async function () {
  if (!window.pesananAktif || window.pesananAktif.status !== "SEARCHING") {
    tampilkanPesan("Pesanan sudah tidak tersedia.");
    return;
  }
  await ubahStatusOrder("REJECTED", "Pesanan ditolak.");
  setTimeout(() => {
    window.pesananAktifId = null;
    window.pesananAktif = null;
    resetTampilanPesanan();
  }, 1200);
};

window.mulaiPerjalananFirebase = async function () {
  if (!window.pesananAktif || window.pesananAktif.status !== "ACCEPTED") {
    tampilkanPesan("Pesanan belum berstatus ACCEPTED.");
    return;
  }
  await ubahStatusOrder("TO_PICKUP", "Menuju lokasi penjemputan.");
};

window.tibaDiLokasiFirebase = async function () {
  if (!window.pesananAktif || window.pesananAktif.status !== "TO_PICKUP") {
    tampilkanPesan("Status pesanan bukan TO_PICKUP.");
    return;
  }
  await ubahStatusOrder("IN_TRIP", "Perjalanan dimulai.");
};

window.selesaikanPerjalananFirebase = async function () {
  if (!window.pesananAktif || window.pesananAktif.status !== "IN_TRIP") {
    tampilkanPesan("Perjalanan belum berstatus IN_TRIP.");
    return;
  }
  await ubahStatusOrder("COMPLETED", "Perjalanan selesai.");
  setTimeout(() => {
    window.pesananAktifId = null;
    window.pesananAktif = null;
    resetTampilanPesanan();
  }, 2000);
};

/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.replace("Login-penumpang.html");
    return;
  }

  if (user.uid === UID_PENUMPANG) {
    window.location.replace("NEXX-PENUMPANG.html");
    return;
  }

  if (user.uid !== UID_PENGEMUDI) {
    await signOut(auth);
    window.location.replace("Login-penumpang.html");
    return;
  }

  pengemudiAktif = user;
  console.log("NEXX DRIVER LOGIN:", user.uid);

  mulaiPantauPesanan();
  mulaiKirimLokasiDriver();

  await window.sinkronStatusOnline(false);

  // Presence offline saat disconnect
  const presenceRef = ref(db, "driverPresence/" + user.uid);
  onDisconnect(presenceRef).update({
    uid: user.uid,
    online: false,
    updatedAt: serverTimestamp()
  });

  // Cleanup presence saat logout
  window.addEventListener("beforeunload", () => {
    window.sinkronStatusOnline(false);
  });

  tampilkanPesan("Driver siap.");
});

</script>

</body>
